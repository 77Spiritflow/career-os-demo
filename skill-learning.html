<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>技能学习 · Career OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --primary: #0F766E; --primary-hover: #0D6B63; --primary-light: #14B8A6;
    --primary-50: #F0FDFA; --primary-100: #CCFBF1;
    --indigo: #4F46E5; --indigo-light: #EEF2FF;
    --accent: #F59E0B; --accent-light: #FEF3C7;
    --sky: #0284C7; --sky-light: #E0F2FE;
    --violet: #7C3AED; --violet-light: #EDE9FE;
    --rose: #E11D48; --rose-light: #FFE4E6;
    --green: #059669; --green-light: #D1FAE5;
    --white: #FFFFFF;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0; --gray-300: #CBD5E1;
    --gray-400: #94A3B8; --gray-500: #64748B; --gray-600: #475569; --gray-900: #0F172A;
    --radius-lg: 16px; --radius-md: 12px; --radius-sm: 10px;
    --shadow-sm: 0 1px 3px rgba(15,23,42,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:430px;width:100%;min-height:100vh;background:var(--gray-50);margin:0 auto;position:relative;padding-bottom:40px}
.top-nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(226,232,240,.5)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;padding:4px 0}
.nav-back:active{color:var(--gray-900)}
.nav-back svg{width:18px;height:18px}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--gray-900)}
.nav-count{position:absolute;right:16px;font-size:12px;color:var(--gray-400);font-weight:500}
.page{padding:16px 16px 0}
.section{margin-bottom:18px}

/* ── 添加按钮 ── */
.add-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;border:none;border-radius:var(--radius-md);padding:13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.25);transition:all .2s;margin-bottom:14px}
.add-btn:active{transform:scale(.97)}
.add-btn svg{width:17px;height:17px}

/* ── 统计 ── */
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat-card{flex:1;background:#fff;border-radius:var(--radius-md);padding:12px;text-align:center;border:1px solid var(--gray-100);box-shadow:var(--shadow-sm)}
.stat-num{font-size:20px;font-weight:800;color:var(--primary)}
.stat-num.gray{color:var(--gray-400)}
.stat-label{font-size:11px;color:var(--gray-400);margin-top:2px}

/* ── 筛选 ── */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 14px;font-size:12px;font-weight:500;color:var(--gray-500);background:#fff;border:1px solid var(--gray-200);border-radius:99px;cursor:pointer;transition:all .2s;font-family:inherit}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

/* ── 技能卡片 ── */
.skill-list{display:flex;flex-direction:column;gap:10px}
.skill-card{background:#fff;border-radius:var(--radius-md);padding:14px;border:1px solid var(--gray-100);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
.skill-check{width:44px;height:44px;border-radius:50%;border:2px solid var(--gray-200);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .25s;color:transparent}
.skill-check svg{width:20px;height:20px}
.skill-card.mastered .skill-check{background:var(--green);border-color:var(--green);color:#fff}
.skill-main{flex:1;min-width:0}
.skill-name{font-size:14px;font-weight:700;color:var(--gray-900);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.skill-card.mastered .skill-name{color:var(--gray-500)}
.skill-tag{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:500}
.skill-cat{background:var(--indigo-light);color:var(--indigo)}
.skill-cycle{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--gray-400);margin-top:5px}
.skill-cycle svg{width:12px;height:12px}
.skill-actions{display:flex;gap:4px;flex-shrink:0}
.skill-act{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:none;background:none;color:var(--gray-400);border-radius:9px;cursor:pointer;transition:all .2s}
.skill-act:active{background:var(--gray-100)}
.skill-act svg{width:15px;height:15px}
.skill-act.edit{color:var(--primary)}
.skill-act.del{color:var(--rose)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 20px;color:var(--gray-300)}
.empty svg{width:42px;height:42px}
.empty p{font-size:13px;color:var(--gray-400);text-align:center;line-height:1.7}

/* ── 弹窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:0 24px;opacity:0;transition:opacity .25s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:20px;max-height:86vh;overflow-y:auto;transform:scale(.92);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.modal-overlay.show .modal-box{transform:scale(1)}
.modal-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--gray-500);margin-bottom:6px}
.form-input{width:100%;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;background:var(--white);color:var(--gray-900);transition:border-color .2s;outline:none}
.form-input:focus{border-color:var(--primary)}
.form-hint{font-size:11px;color:var(--gray-400);margin-top:4px;line-height:1.5}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap}
.cat-chip{flex-shrink:0;padding:6px 12px;font-size:12px;font-weight:500;color:var(--gray-500);background:var(--gray-100);border:none;border-radius:99px;cursor:pointer;font-family:inherit;transition:all .2s}
.cat-chip.active{background:var(--primary);color:#fff;font-weight:600}
.master-toggle{display:flex;align-items:center;gap:8px;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);cursor:pointer;transition:border-color .2s;user-select:none}
.master-toggle.sel{border-color:var(--green);background:var(--green-light)}
.master-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--gray-300);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .2s;flex-shrink:0}
.master-toggle.sel .master-check{background:var(--green);border-color:var(--green);color:#fff}
.master-check svg{width:14px;height:14px}
.master-text{font-size:13px;font-weight:500;color:var(--gray-600)}
.master-toggle.sel .master-text{color:var(--green)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;box-shadow:0 4px 16px rgba(15,118,110,.25)}
.btn-outline{background:#fff;color:var(--gray-500);border:1.5px solid var(--gray-200)}
.btn-danger{background:var(--rose-light);color:var(--rose)}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--gray-900);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:400;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:431px){body{background:#E2E8F0}.app{box-shadow:0 0 80px rgba(0,0,0,.08)}}
    </style>
</head>
<body>
<div class="app">
    <nav class="top-nav">
        <button class="nav-back" onclick="window.location.href='index.html?tab=prepare'" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span>返回</span>
        </button>
        <span class="nav-title">技能学习</span>
        <span class="nav-count" id="navCount">0 个技能</span>
    </nav>

    <div class="page">
        <div class="section">
            <button class="add-btn" onclick="openAdd()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                <span>添加技能</span>
            </button>

            <div class="stat-row">
                <div class="stat-card"><div class="stat-num" id="statMastered">0</div><div class="stat-label">已掌握</div></div>
                <div class="stat-card"><div class="stat-num gray" id="statLearning">0</div><div class="stat-label">学习中</div></div>
                <div class="stat-card"><div class="stat-num gray" id="statTotal">0</div><div class="stat-label">技能总数</div></div>
            </div>

            <div class="filter-row">
                <button class="filter-chip active" data-st="all" onclick="setFilter(this)">全部</button>
                <button class="filter-chip" data-st="learning" onclick="setFilter(this)">学习中</button>
                <button class="filter-chip" data-st="mastered" onclick="setFilter(this)">已掌握</button>
            </div>
            <div class="skill-list" id="skillList"></div>
        </div>
    </div>
</div>

<!-- 添加/编辑弹窗 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">添加技能</div>
        <div class="form-group">
            <label class="form-label">技能名称 *</label>
            <input class="form-input" id="fName" placeholder="如：Python / SQL / 用户调研" maxlength="30">
        </div>
        <div class="form-group">
            <label class="form-label">分类</label>
            <div class="cat-chips" id="catChips">
                <button type="button" class="cat-chip active" data-ca="编程" onclick="selectCat(this)">编程</button>
                <button type="button" class="cat-chip" data-ca="数据分析" onclick="selectCat(this)">数据分析</button>
                <button type="button" class="cat-chip" data-ca="研究方法" onclick="selectCat(this)">研究方法</button>
                <button type="button" class="cat-chip" data-ca="设计工具" onclick="selectCat(this)">设计工具</button>
                <button type="button" class="cat-chip" data-ca="软技能" onclick="selectCat(this)">软技能</button>
                <button type="button" class="cat-chip" data-ca="其他" onclick="selectCat(this)">其他</button>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">学习周期</label>
            <input class="form-input" id="fCycle" placeholder="如：3 个月 / 每周 5 小时" maxlength="30">
        </div>
        <div class="form-group">
            <label class="form-label">当前状态</label>
            <div class="master-toggle" id="masterToggle" onclick="toggleMaster()">
                <div class="master-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div class="master-text">我已掌握该技能</div>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveSkill()">保存</button>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="delModal">
    <div class="modal-box">
        <div class="modal-title">删除技能</div>
        <p style="font-size:13.5px;color:var(--gray-500);line-height:1.7" id="delSkillText"></p>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeDelModal()">取消</button>
            <button class="btn btn-danger" onclick="confirmDel()">删除</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   skill-learning.js | Career OS — 技能学习
   数据存储：localStorage 'cos_skills'
   勾选掌握后，「我的」页技能数量实时读取此数据
   ============================================================ */
var SKILL_KEY = 'cos_skills';

function getSkills(){ try{ var v=JSON.parse(localStorage.getItem(SKILL_KEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function saveSkills(list){ try{ localStorage.setItem(SKILL_KEY, JSON.stringify(list)); }catch(e){ console.warn('[skill-learning] 写入失败', e); } }

/* 种子示例（首次打开预置，可编辑/删除） */
var SEED = [
    { id:'sk-1001', name:'Python', category:'编程', cycle:'3 个月', mastered:true, createdAt:Date.now()-86400000*10, masteredAt:Date.now()-86400000*2 },
    { id:'sk-1002', name:'SQL', category:'数据分析', cycle:'2 个月', mastered:false, createdAt:Date.now()-86400000*5 },
    { id:'sk-1003', name:'用户调研', category:'研究方法', cycle:'持续进行', mastered:false, createdAt:Date.now()-86400000*3 }
];

var curFilter = 'all';
var editingId = null;
var selCat = '编程';
var isMastered = false;
var delId = null;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); }, 2200); }

function init(){
    var list = getSkills();
    if(list.length===0){ saveSkills(SEED.slice()); }
    renderList();
}
function setFilter(btn){
    document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    curFilter = btn.dataset.st;
    renderList();
}
function renderList(){
    var list = getSkills();
    var mastered = 0, learning = 0;
    list.forEach(function(s){ if(s.mastered) mastered++; else learning++; });
    document.getElementById('statMastered').textContent = mastered;
    document.getElementById('statLearning').textContent = learning;
    document.getElementById('statTotal').textContent = list.length;
    document.getElementById('navCount').textContent = list.length + ' 个技能';

    var html = '';
    var shown = 0;
    list.forEach(function(s){
        if(curFilter==='mastered' && !s.mastered) return;
        if(curFilter==='learning' && s.mastered) return;
        shown++;
        html += '<div class="skill-card'+(s.mastered?' mastered':'')+'" data-id="'+s.id+'">'+
            '<div class="skill-check" onclick="toggleMasterCard(\''+s.id+'\')" aria-label="切换掌握状态"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+
            '<div class="skill-main">'+
                '<div class="skill-name">'+esc(s.name)+(s.category?'<span class="skill-tag skill-cat">'+esc(s.category)+'</span>':'')+(s.mastered?'<span class="skill-tag" style="background:var(--green-light);color:var(--green)">已掌握</span>':'')+'</div>'+
                (s.cycle?'<div class="skill-cycle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+esc(s.cycle)+(s.mastered&&s.masteredAt?' · '+fmtDate(s.masteredAt)+' 掌握':(s.createdAt?' · '+fmtDate(s.createdAt)+' 开始':''))+'</div>':'')+
            '</div>'+
            '<div class="skill-actions">'+
                '<button class="skill-act edit" onclick="openEdit(\''+s.id+'\')" aria-label="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'+
                '<button class="skill-act del" onclick="openDel(\''+s.id+'\')" aria-label="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>'+
            '</div>'+
        '</div>';
    });
    if(shown===0){
        html = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><p>'+(curFilter!=='all'?'没有符合条件的技能':'还没有技能记录，点击「添加技能」规划你的学习目标')+'</p></div>';
    }
    document.getElementById('skillList').innerHTML = html;
}
function fmtDate(ts){
    if(!ts) return '';
    var d = new Date(ts);
    return (d.getMonth()+1)+'月'+d.getDate()+'日';
}

/* ── 掌握状态（列表卡片直接打勾） ── */
function toggleMasterCard(id){
    var list = getSkills();
    var s = list.find(function(x){ return x.id===id; });
    if(!s) return;
    s.mastered = !s.mastered;
    s.masteredAt = s.mastered ? Date.now() : null;
    saveSkills(list);
    showToast(s.mastered ? '🎉 已掌握「'+s.name+'」' : '已取消掌握');
    renderList();
}

/* ── 添加 / 编辑 ── */
function openAdd(){
    editingId = null;
    document.getElementById('modalTitle').textContent = '添加技能';
    selCat = '编程'; isMastered = false;
    syncCatChips(); syncMasterToggle();
    document.getElementById('fName').value = '';
    document.getElementById('fCycle').value = '';
    document.getElementById('modal').classList.add('show');
    setTimeout(function(){ document.getElementById('fName').focus(); }, 150);
}
function openEdit(id){
    var list = getSkills();
    var s = list.find(function(x){ return x.id===id; });
    if(!s) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = '编辑技能';
    selCat = s.category || '其他'; isMastered = !!s.mastered;
    syncCatChips(); syncMasterToggle();
    document.getElementById('fName').value = s.name||'';
    document.getElementById('fCycle').value = s.cycle||'';
    document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function selectCat(btn){
    document.querySelectorAll('#catChips .cat-chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    selCat = btn.dataset.ca;
}
function syncCatChips(){
    document.querySelectorAll('#catChips .cat-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.ca===selCat); });
}
function toggleMaster(){
    isMastered = !isMastered;
    syncMasterToggle();
}
function syncMasterToggle(){
    document.getElementById('masterToggle').classList.toggle('sel', isMastered);
}
function saveSkill(){
    var name = document.getElementById('fName').value.trim();
    if(!name){ showToast('请输入技能名称'); return; }
    var cycle = document.getElementById('fCycle').value.trim();
    var list = getSkills();
    if(editingId){
        var s = list.find(function(x){ return x.id===editingId; });
        if(s){
            s.name=name; s.category=selCat; s.cycle=cycle;
            if(isMastered && !s.mastered){ s.mastered=true; s.masteredAt=Date.now(); }
            else if(!isMastered){ s.mastered=false; s.masteredAt=null; }
        }
        saveSkills(list);
        showToast('✅ 已更新');
    } else {
        list.unshift({ id:'sk-'+Date.now(), name:name, category:selCat, cycle:cycle, mastered:isMastered, masteredAt:isMastered?Date.now():null, createdAt:Date.now() });
        saveSkills(list);
        showToast('✅ 已添加');
    }
    closeModal();
    renderList();
}

/* ── 删除 ── */
function openDel(id){
    var list = getSkills();
    var s = list.find(function(x){ return x.id===id; });
    if(!s) return;
    delId = id;
    document.getElementById('delSkillText').textContent = '确定删除技能「'+esc(s.name)+'」吗？';
    document.getElementById('delModal').classList.add('show');
}
function closeDelModal(){ document.getElementById('delModal').classList.remove('show'); }
function confirmDel(){
    var list = getSkills().filter(function(x){ return x.id!==delId; });
    saveSkills(list);
    delId = null;
    closeDelModal();
    showToast('已删除');
    renderList();
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>职业图景 · Career OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
/* ============================================================
   global.css | Career OS — 全局公共样式
   ============================================================ */
:root {
    --primary: #0F766E; --primary-hover: #0D6B63; --primary-light: #14B8A6;
    --primary-50: #F0FDFA; --primary-100: #CCFBF1; --primary-200: #99F6E4;
    --white: #FFFFFF;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
    --gray-300: #CBD5E1; --gray-400: #94A3B8; --gray-500: #64748B;
    --gray-600: #475569; --gray-900: #0F172A;
    --accent: #F59E0B; --accent-light: #FEF3C7;
    --indigo: #6366F1; --indigo-light: #EEF2FF;
    --rose: #F43F5E; --rose-light: #FFF1F2;
    --violet: #8B5CF6; --violet-light: #F5F3FF;
    --sky: #0EA5E9; --sky-light: #E0F2FE;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.02);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
    --radius-sm: 12px; --radius-md: 16px; --radius-lg: 22px; --radius-xl: 28px;
    --nav-h: 56px; --tab-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--gray-50);position:relative}
.top-nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;transition:color .2s;padding:4px 0}
.nav-back:active{color:var(--gray-900)}
.nav-back svg{width:18px;height:18px}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--gray-900);letter-spacing:-.01em}
.screen{display:none;padding:20px;padding-bottom:80px;flex-direction:column}
.screen.active{display:flex;animation:screenIn .35s ease both}
.btn-primary{width:100%;padding:13px 24px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.25);transition:all .2s}
.btn-primary:active{transform:scale(.97)}
.btn-outline{width:100%;padding:13px 24px;background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-outline:active{background:var(--primary-50);transform:scale(.98)}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--gray-900);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes screenIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(min-width:431px){body{background:#E2E8F0}.app{box-shadow:0 0 80px rgba(0,0,0,.08)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* === career-vision 独有样式 === */
.cv-hero{width:100%;background:linear-gradient(145deg,#0D5F59,var(--primary),var(--primary-light));border-radius:var(--radius-xl);padding:28px 24px;color:#fff;text-align:center;margin-bottom:20px;position:relative;overflow:hidden;animation:fadeUp .5s ease both}
.cv-hero::before{content:'';position:absolute;top:-30%;right:-15%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 65%);border-radius:50%}
.cv-code{font-size:32px;font-weight:800;letter-spacing:.04em;margin-bottom:6px}
.cv-code-sub{font-size:13px;opacity:.85;line-height:1.5}
.cv-goal-count{display:inline-block;margin-top:10px;padding:4px 12px;background:rgba(255,255,255,.18);border-radius:100px;font-size:11px;font-weight:500;backdrop-filter:blur(6px)}
.cv-section{width:100%;margin-bottom:20px;animation:fadeUp .4s ease both}
.cv-section-title{font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cv-section-title svg{width:18px;height:18px;color:var(--primary)}
.cv-dims{animation:fadeUp .4s ease .1s both}
.dim-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dim-label{width:28px;font-size:12px;font-weight:700;color:var(--gray-500);flex-shrink:0}
.dim-name{width:48px;font-size:11px;color:var(--gray-400);flex-shrink:0}
.dim-track{flex:1;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden}
.dim-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.dim-fill.top{background:linear-gradient(90deg,var(--primary),var(--primary-light))}
.dim-fill.mid{background:linear-gradient(90deg,var(--indigo),#818CF8)}
.dim-fill.low{background:var(--gray-300)}
.dim-pct{width:28px;font-size:11px;font-weight:600;color:var(--gray-500);text-align:right;flex-shrink:0}
.dim-pct.top{color:var(--primary)}
.dim-pct.mid{color:var(--indigo)}
.cv-profile{width:100%;background:#fff;border-radius:var(--radius-md);padding:16px 18px;border:1px solid var(--gray-100);margin-bottom:20px;animation:fadeUp .4s ease .15s both}
.cv-profile-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cv-profile-text{font-size:13px;color:var(--gray-600);line-height:1.7}
.cv-ai-summary{width:100%;background:#fff;border-radius:var(--radius-md);padding:16px 18px;border:1px solid var(--gray-100);margin-bottom:20px;animation:fadeUp .4s ease both}
.cv-ai-summary-label{font-size:11px;font-weight:600;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.cv-ai-summary-text{font-size:13px;color:var(--gray-600);line-height:1.7}
.career-section{width:100%;margin-bottom:20px;animation:fadeUp .4s ease .2s both}
.career-section-title{font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.career-section-title svg{width:18px;height:18px;color:var(--primary)}
.career-rpt-card{background:#fff;border-radius:var(--radius-md);padding:18px;border:1px solid var(--gray-100);margin-bottom:12px;animation:fadeUp .4s ease both}
.career-rpt-card:nth-child(2){animation-delay:.08s}
.career-rpt-card:nth-child(3){animation-delay:.16s}
.career-rpt-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.career-rpt-rank{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.career-rpt-rank.r1{background:linear-gradient(135deg,#FBBF24,#F59E0B)}
.career-rpt-rank.r2{background:linear-gradient(135deg,#94A3B8,#64748B)}
.career-rpt-rank.r3{background:linear-gradient(135deg,#D97706,#B45309)}
.career-rpt-name{flex:1;font-size:15px;font-weight:700;color:var(--gray-900)}
.career-rpt-match{font-size:20px;font-weight:800;color:var(--primary);flex-shrink:0}
.career-rpt-match span{font-size:12px;font-weight:500}
.career-rpt-bar{width:100%;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;margin-bottom:14px}
.career-rpt-bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.career-rpt-bar-fill.r1{background:linear-gradient(90deg,var(--primary),var(--primary-light))}
.career-rpt-bar-fill.r2{background:linear-gradient(90deg,var(--indigo),#818CF8)}
.career-rpt-bar-fill.r3{background:linear-gradient(90deg,var(--sky),#38BDF8)}
.career-rpt-reasons{margin-bottom:12px}
.career-rpt-reasons-title{font-size:11.5px;font-weight:600;color:var(--gray-500);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.career-rpt-reason{font-size:12.5px;color:var(--gray-600);line-height:1.55;padding-left:12px;margin-bottom:4px;position:relative}
.career-rpt-reason::before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--primary)}
.career-rpt-skills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.career-rpt-skill{font-size:11px;font-weight:500;padding:4px 10px;border-radius:100px;background:var(--primary-50);color:var(--primary)}
.career-rpt-growth{font-size:12px;color:var(--gray-500);line-height:1.5;padding:10px 12px;background:var(--gray-50);border-radius:8px;margin-bottom:0}
.career-rpt-growth-label{font-size:11px;font-weight:600;color:var(--gray-400);margin-bottom:2px}
.cv-goal-list{display:flex;flex-direction:column;gap:8px}
.cv-goal-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-radius:var(--radius-sm);border:1px solid var(--gray-100)}
.cv-goal-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0}
.cv-goal-name{font-size:13px;font-weight:600;color:var(--gray-900)}
.cv-timeline-card{width:100%;background:#fff;border-radius:var(--radius-md);padding:16px 18px;border:1px solid var(--gray-100);animation:fadeUp .4s ease both}
.cv-timeline-text{font-size:13px;color:var(--gray-600);line-height:1.7}
.cv-hint-card{width:100%;background:var(--primary-50);border-radius:var(--radius-md);padding:18px;border:1px dashed var(--primary-light);text-align:center;margin-bottom:20px;animation:fadeUp .4s ease both}
.cv-hint-icon{font-size:28px;margin-bottom:8px}
.cv-hint-text{font-size:13px;color:var(--gray-600);margin-bottom:12px;line-height:1.6}
.cv-hint-btn{display:inline-block;padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(15,118,110,.2);transition:all .2s}
.cv-hint-btn:active{transform:scale(.97)}
.cv-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;animation:fadeUp .5s ease both}
.cv-empty-icon{font-size:56px;margin-bottom:16px}
.cv-empty-title{font-size:18px;font-weight:700;color:var(--gray-900);margin-bottom:8px}
.cv-empty-desc{font-size:13px;color:var(--gray-500);line-height:1.6;margin-bottom:24px;max-width:260px}
.cv-empty-btn{display:inline-block;padding:12px 32px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.25);transition:all .2s}
.cv-empty-btn:active{transform:scale(.97)}
.cv-footer{padding:20px;padding-bottom:calc(20px + var(--safe-b));text-align:center}
.cv-retest-btn{padding:10px 24px;background:transparent;color:var(--gray-500);border:1.5px solid var(--gray-300);border-radius:var(--radius-sm);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s}
.cv-retest-btn:active{background:var(--gray-100);transform:scale(.98)}
/* === AI 拆解中长期目标模块 === */
.gp-card{background:#fff;border-radius:var(--radius-md);border:1px solid var(--gray-100);overflow:hidden;animation:fadeUp .4s ease both}
.gp-generate{text-align:center;padding:28px 20px;background:var(--primary-50);border:1px dashed var(--primary-light);border-radius:var(--radius-md);animation:fadeUp .4s ease both}
.gp-generate-icon{font-size:32px;margin-bottom:8px}
.gp-generate-title{font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:6px}
.gp-generate-desc{font-size:12.5px;color:var(--gray-500);line-height:1.65;margin-bottom:16px}
.gp-btn{display:inline-block;padding:9px 20px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(15,118,110,.2);transition:all .2s}
.gp-btn:active{transform:scale(.97)}
.gp-btn.small{padding:7px 12px;font-size:12px;flex-shrink:0;border-radius:8px;box-shadow:none}
.gp-btn.done{background:var(--gray-200);color:var(--gray-500);box-shadow:none;cursor:default}
.gp-stage{margin-bottom:12px}
.gp-stage:last-child{margin-bottom:0}
.gp-stage-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--gray-50)}
.gp-stage-name{font-size:13px;font-weight:700;color:var(--gray-900)}
.gp-stage-tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--primary-100);color:var(--primary)}
.gp-stage-first .gp-stage-tag{background:var(--accent-light);color:#B45309}
.gp-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--gray-50);transition:all .2s}
.gp-item:last-child{border-bottom:none}
.gp-item.done{opacity:.55}
.gp-cb{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gray-300);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;transition:all .2s}
.gp-cb svg{width:12px;height:12px;color:#fff;opacity:0}
.gp-item.done .gp-cb{background:var(--primary);border-color:var(--primary)}
.gp-item.done .gp-cb svg{opacity:1}
.gp-info{flex:1;min-width:0}
.gp-name{font-size:13.5px;font-weight:600;color:var(--gray-900);transition:all .2s}
.gp-item.done .gp-name{color:var(--gray-400);text-decoration:line-through}
.gp-reason{font-size:11.5px;color:var(--gray-500);line-height:1.5;margin-top:2px}
.gp-msteps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gp-mstep{font-size:10.5px;padding:3px 10px;border-radius:100px;background:var(--gray-100);color:var(--gray-500);cursor:pointer;transition:all .2s;border:1px solid transparent;font-family:inherit}
.gp-mstep.cur{background:var(--primary-50);color:var(--primary);border-color:var(--primary-light);font-weight:600}
.gp-mstep.done{background:var(--primary-100);color:var(--primary)}
.gp-mstep.open{background:#fff;color:var(--primary);border-color:var(--primary);font-weight:600}
.gp-task-row{display:none;margin-top:8px;padding:8px 10px;background:var(--gray-50);border-radius:8px;animation:fadeUp .25s ease both}
.gp-task-row.show{display:block}
.gp-task{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.gp-task-cb{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--gray-300);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;transition:all .2s}
.gp-task-cb svg{width:9px;height:9px;opacity:0;transition:opacity .2s}
.gp-task-cb.checked{background:var(--primary);border-color:var(--primary)}
.gp-task-cb.checked svg{opacity:1}
.gp-task-name{font-size:11.5px;color:var(--gray-700);line-height:1.45}
.gp-task.done .gp-task-name{color:var(--gray-400);text-decoration:line-through}
.gp-mbar{display:flex;align-items:center;gap:8px;margin-top:8px}
.gp-mbar-track{flex:1;height:5px;background:var(--gray-100);border-radius:3px;overflow:hidden}
.gp-mbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--primary-light));transition:width .3s}
.gp-mpct{font-size:10.5px;font-weight:700;color:var(--primary);flex-shrink:0}
.gp-note{font-size:11px;color:var(--gray-400);text-align:center;padding:10px 14px;background:var(--gray-50);border-radius:8px;margin-top:12px;line-height:1.6;animation:fadeUp .4s ease both}
</style>

<script>
/* ============================================================
   store.js | Career OS — 全局数据存储
   所有跨页面共享数据统一存放于此，使用 localStorage 持久化
   ============================================================ */
var Store = (function () {
    var STORAGE_KEY = 'career_os_store';
    var _defaults = {
        user: null,
        assessment: null,
        careerGoal: null,
        goalPool: null,
        timeline: null,
        dailyTasks: null,
        portfolio: null
    };
    var _data = {};
    function _load() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) { _data = JSON.parse(raw); } else { _data = _deepClone(_defaults); }
        } catch (e) { _data = _deepClone(_defaults); }
        for (var key in _defaults) { if (_data[key] === undefined) { _data[key] = _defaults[key]; } }
    }
    function _save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(_data)); } catch (e) { console.warn('[Store] localStorage 写入失败', e); }
    }
    function _deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
    _load();
    return {
        get: function (key) { if (key) return _data[key]; return _deepClone(_data); },
        set: function (key, value) { _data[key] = value; _save(); },
        batch: function (updates) { for (var key in updates) { if (updates.hasOwnProperty(key)) { _data[key] = updates[key]; } } _save(); },
        clear: function () { _data = _deepClone(_defaults); _save(); },
        remove: function (key) { _data[key] = _defaults[key] !== undefined ? _defaults[key] : null; _save(); },
        hasAssessment: function () { return !!(_data.assessment && _data.assessment.code); },
        hasCareerGoal: function () { return !!(_data.careerGoal && _data.careerGoal.length > 0); }
    };
})();
</script>
    <script>
/* ============================================================
   router.js | Career OS — 页面跳转辅助函数
   所有页面跳转优先使用此模块，统一管理路由
   ============================================================ */
var Router = (function () {
    var BASE = '';
    return {
        go: function (page) { window.location.href = BASE + page; },
        toIndex: function () { this.go('index.html'); },
        toAssessment: function () { this.go('assessment.html'); },
        toAiAnalysis: function () { this.go('ai-analysis.html'); },
        toAiChat: function () { this.go('ai-chat.html'); },
        toCareerVision: function () { this.go('career-vision.html'); },
        toSettings: function () { this.go('settings.html'); },
        toLogin: function () { this.go('login.html'); },
        back: function () { window.history.back(); },
        currentPage: function () { var path = window.location.pathname; var file = path.substring(path.lastIndexOf('/') + 1); return file.replace('.html', ''); }
    };
})();
</script>
<script>
var toastTimer;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(m){var t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=m;t.classList.add('show');toastTimer=setTimeout(function(){t.classList.remove('show');},2200);}

  }else{

      var rankCls=['r1','r2','r3'];var medals=['🥇','🥈','🥉'];
      aiReport.careers.forEach(function(c,idx){
        h+='<div class="career-rpt-card"><div class="career-rpt-top"><div class="career-rpt-rank '+rankCls[idx]+'">'+medals[idx]+'</div><div class="career-rpt-name">'+esc(c.name)+'</div><div class="career-rpt-match">'+esc(c.match)+'<span>%</span></div></div>';
        h+='<div class="career-rpt-bar"><div class="career-rpt-bar-fill '+rankCls[idx]+'" data-p="'+c.match+'" style="width:0%"></div></div>';
        if(c.reasons&&c.reasons.length){h+='<div class="career-rpt-reasons"><div class="career-rpt-reasons-title">📝 匹配原因</div>';c.reasons.forEach(function(r){h+='<div class="career-rpt-reason">'+esc(r)+'</div>';});h+='</div>';}
        if(c.skills&&c.skills.length){h+='<div class="career-rpt-skills">';c.skills.forEach(function(sk){h+='<span class="career-rpt-skill">'+esc(sk)+'</span>';});h+='</div>';}
        if(c.growth){h+='<div class="career-rpt-growth"><div class="career-rpt-growth-label">📈 成长路径</div>'+esc(c.growth)+'</div>';}
        h+='</div>';
      });
      h+='</div>';
    }
  }
  h+='<div class="cv-section"><div class="cv-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>职业目标</div>';
  if(careerGoal&&careerGoal.length>0){
    h+='<div class="cv-goal-list">';
    careerGoal.forEach(function(g){var gName=g.name||g;h+='<div class="cv-goal-item"><div class="cv-goal-dot"></div><div class="cv-goal-name">'+esc(gName)+'</div></div>';});
    h+='</div>';
  }else{
    h+='<div class="cv-hint-card"><div class="cv-hint-icon">🎯</div><div class="cv-hint-text">还没有选定职业目标<br>去测评页勾选 或 去 AI 分析选择岗位</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="cv-hint-btn" onclick="goToAssessment()">去测评</button>';
    if(aiReport){h+='<button class="cv-hint-btn" onclick="goToAiAnalysis()" style="background:var(--indigo);box-shadow:0 4px 12px rgba(99,102,241,.2)">去 AI 分析</button>';}
    h+='</div></div>';
  }
  h+='</div>';
  h+='<div class="cv-section"><div class="cv-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>AI 拆解中长期目标</div>';

  if(!goalPool||!goalPool.length){
    h+='<div class="gp-generate"><div class="gp-generate-icon">🤖</div><div class="gp-generate-title">AI 拆解中长期目标</div><div class="gp-generate-desc">基于你的职业图景画像，AI 将按阶段拆解当下最适合你去做的中长期目标。你可以打勾标记已完成，并挑选一个目标设为「当前目标」，之后会在首页展示。</div><button class="gp-btn" id="gp-generate-btn" onclick="generateGoalPool()">开始 AI 拆解</button></div>';
  }else{
    var currentNames=currentGoalNames();
    h+='<div class="gp-card">';
    GOAL_POOL_STAGES.forEach(function(st,si){
      var items=goalPool.filter(function(x){return x.stage===st.key;});
      if(!items.length)return;
      h+='<div class="gp-stage'+(si===0?' gp-stage-first':'')+'"><div class="gp-stage-head"><span class="gp-stage-name">'+esc(st.name)+'</span><span class="gp-stage-tag">'+esc(st.tag)+'</span></div>';
      items.forEach(function(g){
        var isCurrent=currentNames.indexOf(g.name)>-1;
        var ms=g.milestones||[];
        var mpct=0;
        if(ms.length){
          var totalT=0,dnT=0;
          ms.forEach(function(x){
            var ts=x.tasks||[];
            var td=x.tasksDone||[];
            totalT+=ts.length;
            for(var k=0;k<ts.length;k++){if(td[k])dnT++;}
          });
          mpct=totalT?Math.round(dnT/totalT*100):0;
        }
        h+='<div class="gp-item'+(g.done?' done':'')+'" data-gp-id="'+g.id+'">'+

              var td=!!(mst.tasksDone&&mst.tasksDone[ti]);
              h+='<div class="gp-task'+(td?' done':'')+'" onclick="toggleTask(\''+g.id+'\','+mi+','+ti+',this)"><div class="gp-task-cb'+(td?' checked':'')+'">'+(td?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'')+'</div><span class="gp-task-name">'+esc(t)+'</span></div>';
            });
            h+='</div>';
          });
          h+='<div class="gp-mbar"><div class="gp-mbar-track"><div class="gp-mbar-fill" style="width:'+mpct+'%"></div></div><span class="gp-mpct">'+mpct+'%</span></div>';
        }
        h+='</div>'+
          (isCurrent?'<span class="gp-btn small done">✓ 已设为目标</span>':'<button class="gp-btn small" onclick="setAsCurrentGoal(\''+g.id+'\')">设为当前目标</button>')+
          '</div>';
      });
      h+='</div>';
    });
    h+='</div>';
    h+='<div style="text-align:center;margin-top:12px"><button class="gp-btn small" onclick="regenerateGoalPool()" style="background:transparent;color:var(--primary);border:1.5px solid var(--primary)">↻ 重新拆解</button></div>';

  }
  h+='</div>';
  h+='<div class="cv-footer"><button class="cv-retest-btn" onclick="goToAssessment()">重新测评</button></div>';
  body.innerHTML=h;
  setTimeout(function(){
    document.querySelectorAll('.dim-fill[data-p]').forEach(function(el){el.style.width=el.dataset.p+'%';});

  },200);
}

function buildGoalPool(){
  var careers=(Store.get('careerGoal')||[]).map(function(c){return (c&&c.name)||c;});
  var pool=[];var idx=0;
  function push(stage,goal){
    if(pool.some(function(x){return x.name===goal.name;}))return;
    pool.push({id:'gp-'+(idx++),stage:stage,name:goal.name,reason:goal.reason,done:false,
      milestones:(goal.milestones||[]).map(function(m){
        var ts=m.tasks||[];
        return {name:m.name,tasks:ts.slice(),done:false,tasksDone:ts.map(function(){return false;})};
      })});
  }
  /* 测评主导维度目标（仅在有测评结果时插入认知探索期） */
  var assessment=Store.get('assessment');
  var code=assessment&&assessment.code?assessment.code:'';
  var dimGoal=code?(RIASEC_DIM_GOAL[code.charAt(0)]||RIASEC_DIM_GOAL.R):null;
  if(dimGoal)push('explore',dimGoal);
  /* 职业定制目标（按用户选定职业，每阶段内去重计划） */
  GOAL_POOL_STAGES.forEach(function(st){
    var stagePlans=[];
    careers.forEach(function(c){
      var plan=CAREER_PLAN[c]||GENERIC_PLAN;
      if(stagePlans.indexOf(plan)>-1)return;
      stagePlans.push(plan);
      (plan[st.key]||[]).forEach(function(g){push(st.key,g);});
    });
  });
  pool._v=2;
  Store.set('goalPool',pool);
  return pool;
}
function generateGoalPool(){
  var btn=document.getElementById('gp-generate-btn');
  if(btn){btn.disabled=true;btn.textContent='AI 拆解中…';}
  setTimeout(function(){
    buildGoalPool();
    render();
  },1400);
}
function regenerateGoalPool(){
  if(!window.confirm('重新拆解会替换当前目标清单（已设为当前目标的不受影响），确定继续吗？'))return;
  var btn=document.getElementById('gp-generate-btn');
  setTimeout(function(){
    buildGoalPool();
    render();
    showToast('已按最新职业与测评重新拆解 🤖');
  },900);
}
function toggleGoalDone(id,el){
  var pool=Store.get('goalPool')||[];
  var g=null;
  pool.forEach(function(x){if(x.id===id)g=x;});
  if(!g)return;
  g.done=!g.done;
  Store.set('goalPool',pool);
  var item=el?el.closest('.gp-item'):null;
  if(item)item.classList.toggle('done',g.done);
}
/* 每个目标的内部阶段（里程碑）模板，按计划阶段区分 */
var GOAL_MILESTONE_TMPL={
  explore:['明确方向','信息收集','方案拆解','输出成果'],
  base:['基础学习','练习巩固','阶段检验','复盘调整'],
  build:['理论学习','工具实操','项目练习','成果输出'],
  practice:['方案设计','实战执行','反馈迭代','复盘沉淀'],
  sprint:['材料准备','技能补强','模拟演练','正式投递']
};
/* 兼容旧数据：v2 数据（目标自带阶段+小任务）直接返回，旧版本数据自动重建 */
function ensureGoalMilestones(){
  var pool=Store.get('goalPool');
  if(!pool||!pool.length)return pool;
  if(pool._v===2)return pool;
  return buildGoalPool();
}
function toggleMsOpen(id,mi,el){
  var item=el?el.closest('.gp-item'):null;
  if(!item)return;
  item.querySelectorAll('.gp-task-row').forEach(function(r,i){r.classList.toggle('show',i===mi);});
  item.querySelectorAll('.gp-mstep').forEach(function(ms,i){ms.classList.toggle('open',i===mi);});
}
function toggleTask(id,mi,ti,el){
  var pool=Store.get('goalPool')||[];
  var g=null;
  pool.forEach(function(x){if(x.id===id)g=x;});
  if(!g||!g.milestones||!g.milestones[mi])return;
  var ms=g.milestones[mi];
  if(!ms.tasksDone)ms.tasksDone=(ms.tasks||[]).map(function(){return false;});
  ms.tasksDone[ti]=!ms.tasksDone[ti];
  var ts=ms.tasks||[];
  ms.done=ts.every(function(t,k){return ms.tasksDone[k];});
  Store.set('goalPool',pool);
  var item=el?el.closest('.gp-item'):null;
  if(!item)return;
  /* 更新该任务勾选样式 */
  var row=item.querySelectorAll('.gp-task-row')[mi];
  if(row){
    var tasks=row.querySelectorAll('.gp-task');
    if(tasks[ti]){
      tasks[ti].classList.toggle('done',!!ms.tasksDone[ti]);
      var cb=tasks[ti].querySelector('.gp-task-cb');
      if(cb){
        cb.classList.toggle('checked',!!ms.tasksDone[ti]);
        cb.innerHTML=ms.tasksDone[ti]?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'';
      }
    }
  }
  /* 更新阶段标签状态 */
  item.querySelectorAll('.gp-mstep').forEach(function(msEl,i){
    var m=g.milestones[i];if(!m)return;
    var curCls=false;
    if(!m.done){
      var beforeAllDone=true;
      for(var b=0;b<i;b++){if(!g.milestones[b].done){beforeAllDone=false;break;}}
      curCls=beforeAllDone;
    }
    var openCls=msEl.classList.contains('open');
    msEl.className='gp-mstep'+(m.done?' done':'')+(curCls?' cur':'')+(openCls?' open':'');
  });
  /* 进度按任务数重算 */
  var total=0,dn=0;
  g.milestones.forEach(function(mm){
    var tts=mm.tasks||[];
    if(!mm.tasksDone)mm.tasksDone=tts.map(function(){return false;});
    total+=tts.length;
    for(var k=0;k<tts.length;k++){if(mm.tasksDone[k])dn++;}
  });
  var pct=total?Math.round(dn/total*100):0;
  var fill=item.querySelector('.gp-mbar-fill');
  var pctEl=item.querySelector('.gp-mpct');
  if(fill)fill.style.width=pct+'%';
  if(pctEl)pctEl.textContent=pct+'%';
}
function currentGoalNames(){
  var gs=[];
  try{gs=JSON.parse(localStorage.getItem('cos_goals_data')||'[]');}catch(e){gs=[];}
  if(!Array.isArray(gs))gs=[];
  return gs.map(function(x){return (x.title||'').replace(/^🎯\s*/,'');});
}
/* 同步每日任务：把当前目标的「当前未完成阶段」子任务拆解为每日任务，写入 Store.dailyTasks */
function syncDailyTasksFromGoals(gs){
  var list=[];
  (gs||[]).forEach(function(g){
    var ms=g.milestones||[];
    var curMi=-1;
    for(var i=0;i<ms.length;i++){if(!ms[i].done){curMi=i;break;}}
    if(curMi<0)return;
    var m=ms[curMi];
    (m.subtasks||[]).forEach(function(s,ti){
      list.push({
        id:g.id+':'+curMi+':'+ti,
        name:s.name,
        time:'',
        tag:'ai',
        done:!!s.done,
        goalId:g.id,
        subtaskRef:{goalId:g.id,mi:curMi,ti:ti},
        fromMilestone:m.name
      });
    });
  });
  if(typeof Store!=='undefined')Store.set('dailyTasks',list);
}
function setAsCurrentGoal(id){
  var pool=Store.get('goalPool')||[];
  var g=null;
  pool.forEach(function(x){if(x.id===id)g=x;});
  if(!g)return;
  var gs=[];
  try{gs=JSON.parse(localStorage.getItem('cos_goals_data')||'[]');}catch(e){gs=[];}
  if(!Array.isArray(gs))gs=[];
  if(gs.some(function(x){return (x.title||'').replace(/^🎯\s*/,'')===g.name;})){
    showToast('该目标已在当前目标中');return;
  }
  gs.unshift({
    id:'goal-'+Date.now(),
    title:'🎯 '+g.name,
    desc:g.reason,
    stages:[],
    start:'',end:'',
    progress:0,
    theme:'teal',
    milestones:(g.milestones||[]).map(function(m,mi){
      var beforeAllDone=true;
      for(var b=0;b<mi;b++){if(!g.milestones[b].done){beforeAllDone=false;break;}}
      return {name:m.name,desc:'',done:m.done,current:!m.done&&beforeAllDone,subtasks:(m.tasks||[]).map(function(t){return{name:t,done:false};})};
    }),
    aiSuggest:'AI 拆解目标建议：'+g.reason
  });
  try{localStorage.setItem('cos_goals_data',JSON.stringify(gs));}catch(e){console.warn('[career-vision] cos_goals_data 写入失败',e);}
  syncDailyTasksFromGoals(gs);
  showToast('已设为当前目标 🎯');
  render();
}
render();

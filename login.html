<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 · Career OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --primary: #0F766E; --primary-hover: #0D6B63; --primary-light: #14B8A6;
    --primary-50: #F0FDFA; --primary-100: #CCFBF1;
    --white: #FFFFFF;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
    --gray-300: #CBD5E1; --gray-400: #94A3B8; --gray-500: #64748B;
    --gray-600: #475569; --gray-900: #0F172A;
    --radius-md: 16px; --radius-sm: 12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:var(--gray-50);display:flex;flex-direction:column;position:relative}
.top-nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);height:56px;display:flex;align-items:center;padding:0 20px}
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;transition:color .2s;padding:4px 0}
.nav-back:active{color:var(--gray-900)}
.nav-back svg{width:18px;height:18px}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--gray-900)}
.login-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;gap:24px}
.login-logo{width:64px;height:64px;background:linear-gradient(145deg,var(--primary),var(--primary-light));border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;box-shadow:0 8px 30px rgba(15,118,110,.2)}
.login-title{font-size:22px;font-weight:700;color:var(--gray-900);letter-spacing:-0.02em}
.login-subtitle{font-size:13px;color:var(--gray-500);margin-top:-16px}
.login-form{width:100%;display:flex;flex-direction:column;gap:12px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;font-weight:500;color:var(--gray-500)}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--white);color:var(--gray-900);transition:border-color .2s;outline:none}
.form-input:focus{border-color:var(--primary)}
.btn-primary{width:100%;padding:13px 24px;background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.25);transition:all .2s;margin-top:8px}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{background:var(--gray-300);box-shadow:none;cursor:default}
.login-footer{font-size:12px;color:var(--gray-400);text-align:center}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--gray-900);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.login-wrap{animation:fadeIn .5s cubic-bezier(.22,1,.36,1) both}
@media(min-width:431px){body{background:#E2E8F0}.app{box-shadow:0 0 80px rgba(0,0,0,.08)}}
    </style>
    <script>
/* ============================================================
   store.js | Career OS — 全局数据存储
   ============================================================ */
var Store = (function () {
    var STORAGE_KEY = 'career_os_store';
    var _defaults = { user: null, assessment: null, careerGoal: null, timeline: null, dailyTasks: null, portfolio: null };
    var _data = {};
    function _load() {
        try { var raw = localStorage.getItem(STORAGE_KEY); _data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(_defaults)); }
        catch (e) { _data = JSON.parse(JSON.stringify(_defaults)); }
        for (var key in _defaults) { if (_data[key] === undefined) _data[key] = _defaults[key]; }
    }
    function _save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(_data)); } catch (e) { console.warn('[Store] localStorage 写入失败', e); } }
    function _deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
    _load();
    return {
        get: function (key) { if (key) return _data[key]; return _deepClone(_data); },
        set: function (key, value) { _data[key] = value; _save(); },
        batch: function (updates) { for (var key in updates) { if (updates.hasOwnProperty(key)) _data[key] = updates[key]; } _save(); },
        clear: function () { _data = _deepClone(_defaults); _save(); },
        remove: function (key) { _data[key] = _defaults[key] !== undefined ? _defaults[key] : null; _save(); },
        hasAssessment: function () { return !!(_data.assessment && _data.assessment.code); },
        hasCareerGoal: function () { return !!(_data.careerGoal && _data.careerGoal.length > 0); }
    };
})();

/* ============================================================
   router.js | Career OS — 页面跳转辅助函数
   ============================================================ */
var Router = (function () {
    var BASE = '';
    return {
        go: function (page) { window.location.href = BASE + page; },
        toIndex: function () { this.go('index.html'); },
        toAssessment: function () { this.go('assessment.html'); },
        toAiAnalysis: function () { this.go('ai-analysis.html'); },
        toAiChat: function () { this.go('ai-chat.html'); },
        toSettings: function () { this.go('settings.html'); },
        toLogin: function () { this.go('login.html'); },
        back: function () { window.history.back(); },
        currentPage: function () { var path = window.location.pathname; var file = path.substring(path.lastIndexOf('/') + 1); return file.replace('.html', ''); }
    };
})();

/* ============================================================
   auth.js | Career OS — 认证模块
   ============================================================ */
var Auth = (function () {
    return {
        isLoggedIn: function () { return !!(Store && Store.get('user')); },
        getUser: function () { return Store ? Store.get('user') : null; },
        login: function (userData) { if (Store) Store.set('user', userData); },
        logout: function () { if (Store) Store.set('user', null); },
        requireLogin: function () { if (!this.isLoggedIn()) { if (typeof Router !== 'undefined') Router.toLogin(); return false; } return true; }
    };
})();
    </script>
</head>
<body>
<div class="app">
    <nav class="top-nav">
        <button class="nav-back" onclick="if(typeof Router!=='undefined'){Router.back();}else{window.history.back();}" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span>返回</span>
        </button>
        <span class="nav-title">登录</span>
    </nav>
    <div class="login-wrap">
        <div class="login-logo">C</div>
        <div class="login-title">欢迎回到 Career OS</div>
        <div class="login-subtitle">登录以保存你的职业规划数据</div>
        <form class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input class="form-input" id="loginEmail" type="email" placeholder="your@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input class="form-input" id="loginPwd" type="password" placeholder="输入密码" required autocomplete="current-password">
            </div>
            <button class="btn-primary" type="submit">登 录</button>
        </form>
        <div class="login-footer">阶段1：纯前端模拟登录 · 数据存储于本地</div>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
function showToast(msg){
    var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);
}
function handleLogin(e){
    e.preventDefault();
    var email=document.getElementById('loginEmail').value.trim();
    var pwd=document.getElementById('loginPwd').value;
    if(!email||!pwd){showToast('请填写邮箱和密码');return;}
    /* 阶段1：模拟登录，取邮箱前缀作为用户名 */
    var name=email.split('@')[0]||'用户';
    Auth.login({id:Date.now(),name:name,email:email});
    showToast('✓ 登录成功');
    setTimeout(function(){
        if(typeof Router!=='undefined'){Router.toIndex();}else{window.location.href='index.html';}
    },800);
}
</script>
</body>
</html>

<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Career OS · AI 对话</title>

    <style>
/* ============================================================
   global.css | Career OS — 全局公共样式
   所有页面共用，页面独有样式写在各自style内
   ============================================================ */

/* ── CSS 变量（全量超集） ── */
:root {
    --primary: #0F766E; --primary-hover: #0D6B63; --primary-light: #14B8A6;
    --primary-50: #F0FDFA; --primary-100: #CCFBF1; --primary-200: #99F6E4;
    --white: #FFFFFF;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
    --gray-300: #CBD5E1; --gray-400: #94A3B8; --gray-500: #64748B;
    --gray-600: #475569; --gray-900: #0F172A;
    --accent: #F59E0B; --accent-light: #FEF3C7;
    --indigo: #6366F1; --indigo-light: #EEF2FF;
    --rose: #F43F5E; --rose-light: #FFF1F2;
    --violet: #8B5CF6; --violet-light: #F5F3FF;
    --sky: #0EA5E9; --sky-light: #E0F2FE;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.02);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
    --radius-sm: 12px; --radius-md: 16px; --radius-lg: 22px; --radius-xl: 28px;
    --nav-h: 56px; --tab-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
}

/* ── Reset ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── Body ── */
body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ── App 容器 ── */
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--gray-50);position:relative}

/* ── 顶部导航栏（基础） ── */
.top-nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px}

/* ── 品牌标识（首页 / 设置页） ── */
.nav-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;color:var(--gray-900);letter-spacing:-0.03em}
.nav-brand-icon{width:30px;height:30px;background:linear-gradient(145deg,var(--primary),var(--primary-light));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}

/* ── AI 按钮（首页 / 设置页） ── */
.nav-ai-btn{display:flex;align-items:center;gap:5px;padding:7px 13px 7px 10px;background:var(--gray-900);color:#fff;border:none;border-radius:100px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;position:relative;overflow:hidden;transition:all .2s}
.nav-ai-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-100%);animation:shimmer 3s ease-in-out infinite}
.nav-ai-btn:active{transform:scale(.95)}
.nav-ai-btn svg{width:14px;height:14px;flex-shrink:0}

/* ── 返回按钮（测评 / AI分析页） ── */
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;transition:color .2s;padding:4px 0}
.nav-back:active{color:var(--gray-900)}
.nav-back svg{width:18px;height:18px}

/* ── 居中标题（测评 / AI分析页） ── */
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--gray-900);letter-spacing:-.01em}

/* ── 步骤文字 ── */
.nav-step{font-size:12px;color:var(--gray-400);font-weight:500}

/* ── Screen 容器（测评 / AI分析页） ── */
.screen{display:none;padding:20px;padding-bottom:80px;flex-direction:column}
.screen.active{display:flex;animation:screenIn .4s cubic-bezier(.22,1,.36,1) both}

/* ── 主按钮 ── */
.btn-primary{width:100%;padding:13px 24px;background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.25);transition:all .2s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{background:var(--gray-300);box-shadow:none;cursor:default}

/* ── 描边按钮 ── */
.btn-outline{width:100%;padding:13px 24px;background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-outline:active{background:var(--primary-50);transform:scale(.98)}

/* ── 底部操作栏 ── */
.bottom-bar{position:sticky;bottom:0;padding:12px 20px;padding-bottom:calc(12px + var(--safe-b));background:rgba(248,250,252,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(226,232,240,.4);display:flex;gap:10px;align-items:center;z-index:50}

/* ── 确认弹窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:0 24px;opacity:0;transition:opacity .25s}
.modal-overlay.show{opacity:1}
.modal-box{background:#fff;border-radius:var(--radius-lg);padding:24px;max-width:320px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.15);transform:scale(.92);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.modal-overlay.show .modal-box{transform:scale(1)}
.modal-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:8px}
.modal-desc{font-size:13px;color:var(--gray-500);line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:10px}
.modal-cancel{flex:1;padding:11px;background:var(--gray-100);color:var(--gray-600);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s}
.modal-cancel:active{background:var(--gray-200)}
.modal-confirm{flex:1;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.modal-confirm:active{background:var(--primary-hover)}

/* ── Toast 通知 ── */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--gray-900);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Keyframes ── */
@keyframes shimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes screenIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes softPop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}
@keyframes dotBounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ── 响应式：桌面端 ── */
@media(min-width:431px){body{background:#E2E8F0}.app{box-shadow:0 0 80px rgba(0,0,0,.08)}}

/* ── 无障碍：减少动画 ── */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
    <script>
/* ============================================================
   store.js | Career OS — 全局数据存储
   所有跨页面共享数据统一存放于此，使用 localStorage 持久化
   ============================================================ */

var Store = (function () {
    var STORAGE_KEY = 'career_os_store';

    // 默认数据结构
    var _defaults = {
        user: null,           // 用户账号信息 { id, name, email, ... }
        assessment: null,     // 测评结果 { answers, scores, code, codeNames, profile, recommendedCareers }
        careerGoal: null,     // 用户选定的职业目标数组 [{ name, dim, ... }]
        timeline: null,       // 中长期目标
        dailyTasks: null,     // 拆解后的每日任务数组
        portfolio: null       // 用户上传的成果沉淀列表
    };

    // 当前内存数据
    var _data = {};

    // 从 localStorage 读取
    function _load() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                _data = JSON.parse(raw);
            } else {
                _data = _deepClone(_defaults);
            }
        } catch (e) {
            _data = _deepClone(_defaults);
        }
        // 确保每个字段都有默认值
        for (var key in _defaults) {
            if (_data[key] === undefined) {
                _data[key] = _defaults[key];
            }
        }
    }

    // 保存到 localStorage
    function _save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(_data));
        } catch (e) {
            console.warn('[Store] localStorage 写入失败', e);
        }
    }

    // 深拷贝
    function _deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
    }

    // 初始化
    _load();

    return {
        /**
         * 获取指定字段值
         * @param {string} key - 字段名
         * @returns {*} 字段值
         */
        get: function (key) {
            if (key) return _data[key];
            return _deepClone(_data);
        },

        /**
         * 设置指定字段值并持久化
         * @param {string} key - 字段名
         * @param {*} value - 字段值
         */
        set: function (key, value) {
            _data[key] = value;
            _save();
        },

        /**
         * 批量更新多个字段
         * @param {Object} updates - { key1: value1, key2: value2, ... }
         */
        batch: function (updates) {
            for (var key in updates) {
                if (updates.hasOwnProperty(key)) {
                    _data[key] = updates[key];
                }
            }
            _save();
        },

        /**
         * 清空所有数据，恢复默认值
         */
        clear: function () {
            _data = _deepClone(_defaults);
            _save();
        },

        /**
         * 删除指定字段
         * @param {string} key
         */
        remove: function (key) {
            _data[key] = _defaults[key] !== undefined ? _defaults[key] : null;
            _save();
        },

        /**
         * 检查用户是否已完成测评
         * @returns {boolean}
         */
        hasAssessment: function () {
            return !!(_data.assessment && _data.assessment.code);
        },

        /**
         * 检查用户是否已选定职业目标
         * @returns {boolean}
         */
        hasCareerGoal: function () {
            return !!(_data.careerGoal && _data.careerGoal.length > 0);
        }
    };
})();

</script>
    <script>
/* ============================================================
   router.js | Career OS — 页面跳转辅助函数
   所有页面跳转优先使用此模块，统一管理路由
   ============================================================ */

var Router = (function () {
    // 基础路径（同目录下的页面）
    var BASE = '';

    return {
        /**
         * 跳转到指定页面
         * @param {string} page - 页面文件名，如 'index.html'
         */
        go: function (page) {
            window.location.href = BASE + page;
        },

        /** 跳转到首页 */
        toIndex: function () {
            this.go('index.html');
        },

        /** 跳转到职业测评页 */
        toAssessment: function () {
            this.go('assessment.html');
        },

        /** 跳转到AI深度分析页 */
        toAiAnalysis: function () {
            this.go('ai-analysis.html');
        },

        /** 跳转到AI对话页 */
        toAiChat: function () {
            this.go('ai-chat.html');
        },

        /** 跳转到设置页 */
        toSettings: function () {
            this.go('settings.html');
        },

        /** 跳转到登录页 */
        toLogin: function () {
            this.go('login.html');
        },

        /** 浏览器后退 */
        back: function () {
            window.history.back();
        },

        /**
         * 获取当前页面名称
         * @returns {string} 如 'index', 'assessment', 'ai-analysis' 等
         */
        currentPage: function () {
            var path = window.location.pathname;
            var file = path.substring(path.lastIndexOf('/') + 1);
            return file.replace('.html', '');
        }
    };
})();

</script>
    <script>
/* ============================================================
   auth.js | Career OS — 认证模块
   阶段1：纯前端模拟，不接 Supabase
   阶段2：接入 Supabase 真实认证
   ============================================================ */

var Auth = (function () {
    return {
        /**
         * 检查用户是否已登录
         * @returns {boolean}
         */
        isLoggedIn: function () {
            return !!(Store && Store.get('user'));
        },

        /**
         * 获取当前登录用户信息
         * @returns {Object|null}
         */
        getUser: function () {
            return Store ? Store.get('user') : null;
        },

        /**
         * 模拟登录（阶段1）
         * @param {Object} userData - 用户数据 { id, name, email }
         */
        login: function (userData) {
            if (Store) {
                Store.set('user', userData);
            }
        },

        /**
         * 退出登录
         */
        logout: function () {
            if (Store) {
                Store.set('user', null);
            }
        },

        /**
         * 需要登录时调用，未登录则跳转登录页
         * @returns {boolean} 是否已登录
         */
        requireLogin: function () {
            if (!this.isLoggedIn()) {
                if (typeof Router !== 'undefined') {
                    Router.toLogin();
                }
                return false;
            }
            return true;
        }
    };
})();

</script>

    <style>
        /* 页面覆盖：ai-chat 特殊布局 */
        body{overflow:hidden}
        .app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
        .top-nav{flex-shrink:0;padding:0 12px 0 4px;background:rgba(248,250,252,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;z-index:30}
        .nav-title{font-size:16px;font-weight:700;letter-spacing:-0.02em}

        /* ── Nav ── */
        .nav-btn{width:40px;height:40px;border:none;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-600);transition:all .15s}
        .nav-btn:active{background:var(--gray-100);transform:scale(.92)}
        .nav-btn svg{width:22px;height:22px}
        .nav-right{display:flex;align-items:center;gap:2px}

        /* ── Tabs ── */
        .tabs{flex-shrink:0;display:flex;gap:4px;padding:0 20px 10px;background:var(--gray-50)}
        .tab{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:500;color:var(--gray-400);background:var(--gray-100);border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all .25s;font-family:inherit}
        .tab.active{background:var(--white);color:var(--gray-900);box-shadow:var(--shadow-sm);font-weight:600}

        /* ── Chat Container ── */
        .chat-container{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;position:relative}
        .chat-container::-webkit-scrollbar{display:none}

        /* ── Initial State ── */
        .chat-initial{padding:30px 22px 20px;display:flex;flex-direction:column;align-items:center;animation:fadeUp .4s ease both}
        .ai-avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,var(--primary),var(--primary-light));display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 4px 16px rgba(15,118,110,.2)}
        .ai-avatar svg{width:28px;height:28px;color:#fff}
        .ai-greeting{font-size:16px;font-weight:600;color:var(--gray-900);text-align:center;line-height:1.5}

        /* ── Messages ── */
        .chat-messages{display:none;padding:16px 20px 8px;flex-direction:column;gap:16px}
        .chat-messages.active{display:flex}
        .chat-initial.hidden{display:none}

        .msg-row{display:flex;gap:10px;max-width:88%}
        .msg-row.user{align-self:flex-end;flex-direction:row-reverse}
        .msg-avatar{width:30px;height:30px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
        .msg-avatar.ai-av{background:linear-gradient(145deg,var(--primary),var(--primary-light));box-shadow:0 2px 8px rgba(15,118,110,.15)}
        .msg-avatar.ai-av svg{width:15px;height:15px;color:#fff}
        .msg-avatar.user-av{background:var(--gray-200);color:var(--gray-600);font-size:11px;font-weight:700}

        .msg-content{min-width:0;max-width:100%}
        .msg-bubble{padding:12px 15px;border-radius:18px;font-size:13.5px;line-height:1.6;word-break:break-word}
        .msg-row.ai .msg-bubble{background:var(--white);color:var(--gray-800);border:1px solid var(--gray-100);border-top-left-radius:6px;box-shadow:var(--shadow-sm)}
        .msg-row.user .msg-bubble{background:var(--gray-900);color:#fff;border-top-right-radius:6px}
        /* 从收藏夹深链进入时的目标消息高亮 */
        .msg-row.deep-focus .msg-bubble{box-shadow:0 0 0 3px rgba(15,118,110,.3),0 4px 16px rgba(15,118,110,.16);transition:box-shadow .3s}
        .msg-bubble strong{font-weight:600;color:var(--gray-900)}
        .msg-row.user .msg-bubble strong{color:#fff}
        .msg-bubble .highlight{color:var(--primary);font-weight:600}
        .msg-row.user .msg-bubble .highlight{color:var(--primary-200)}

        /* ── Message Actions ── */
        .msg-actions{display:flex;align-items:center;gap:2px;margin-top:4px;padding-right:2px;opacity:.55;transition:opacity .2s}
        .msg-row.user .msg-actions{flex-direction:row-reverse;padding-right:0;padding-left:2px;opacity:.55}
        .msg-row.ai .msg-content:active .msg-actions{opacity:1}
        .msg-act{background:none;border:none;color:var(--gray-400);cursor:pointer;display:flex;align-items:center;justify-content:center;width:30px;height:26px;border-radius:6px;transition:all .15s;padding:0}
        .msg-act:active{background:var(--gray-100)}
        .msg-act svg{width:14px;height:14px}
        .msg-act.active-like{color:var(--primary) !important}
        .msg-act.active-dislike{color:var(--rose) !important}
        .msg-act.active-bookmark{color:var(--accent) !important;fill:var(--accent)}

        /* Typing dots */
        .typing-dots{display:flex;gap:4px;padding:4px 0}
        .typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--gray-300);animation:bounce 1.4s ease-in-out infinite}
        .typing-dots span:nth-child(2){animation-delay:.16s}
        .typing-dots span:nth-child(3){animation-delay:.32s}
        @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

        /* Typewriter cursor */
        .tw-cursor{display:inline-block;width:2px;height:1em;background:var(--primary);margin-left:1px;vertical-align:text-bottom;animation:blink-cursor .7s step-end infinite}
        @keyframes blink-cursor{50%{opacity:0}}

        /* Stop button */
        .stop-btn-wrap{display:flex;justify-content:center;padding:4px 0 8px}
        .stop-btn{display:none;align-items:center;gap:6px;padding:7px 18px;border:1.5px solid var(--gray-300);border-radius:100px;background:var(--white);color:var(--gray-600);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;box-shadow:var(--shadow-sm)}
        .stop-btn:active{background:var(--gray-100);transform:scale(.96)}
        .stop-btn.visible{display:flex}
        .stop-btn svg{width:14px;height:14px}

        /* Format helpers */
        .fmt-divider{height:1px;background:var(--gray-200);margin:8px 0}
        .fmt-ck-empty{display:inline-block;width:14px;height:14px;border:1.5px solid var(--gray-300);border-radius:3.5px;vertical-align:middle;margin-right:6px;position:relative;top:-1px}
        .fmt-ck-done{color:var(--primary);margin-right:6px;font-size:13px}
        .fmt-status{margin-right:4px}
        .fmt-bullet{color:var(--primary);margin-right:2px;font-weight:700}
        .fmt-num{color:var(--primary);font-weight:600;margin-right:4px}
        .fmt-bar{font-family:'SF Mono',Monaco,'Cascadia Mono',monospace;font-size:11.5px;color:var(--primary);letter-spacing:-0.5px;background:var(--gray-100);padding:1px 5px;border-radius:4px}

        /* ══════════════════════════════════
           ASSISTANT CARD (fixed at bottom, above input bar)
           ══════════════════════════════════ */
        .assistant-card{
            position:fixed;
            left:0;
            right:0;
            bottom:68px;
            z-index:20;
            display:flex;
            max-width:430px;
            margin:0 auto;
            pointer-events:none;
        }
        .assistant-card > *{
            pointer-events:auto;
        }

        /* Toggle tab — always on the left, always visible */
        .ac-toggle{
            width:40px;
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            background:linear-gradient(145deg,var(--primary),var(--primary-light));
            border-radius:0 14px 14px 0;
            box-shadow:2px 2px 12px rgba(15,118,110,.2);
            transition:all .15s;
            position:relative;
        }
        .ac-toggle:active{transform:scale(.95)}
        .ac-toggle svg{width:18px;height:18px;color:#fff;transition:transform .3s}
        .assistant-card.collapsed .ac-toggle svg{transform:rotate(180deg)}
        .ac-toggle-badge{
            position:absolute;
            top:6px;
            right:6px;
            width:8px;
            height:8px;
            border-radius:50%;
            background:var(--accent);
            border:1.5px solid #fff;
        }

        /* Body wrapper — width animates to 0 when collapsed */
        .ac-body-wrap{
            width:280px;
            overflow:hidden;
            transition:width .35s cubic-bezier(.22,1,.36,1);
        }
        .assistant-card.collapsed .ac-body-wrap{
            width:0;
        }

        /* Body — fixed inner width so content doesn't reflow during transition */
        .ac-body{
            width:280px;
            background:var(--white);
            border-radius:0 14px 14px 0;
            box-shadow:4px 2px 16px rgba(0,0,0,.06);
            display:flex;
            flex-direction:column;
            max-height:420px;
            overflow:hidden;
        }

        .ac-head{
            display:flex;
            align-items:center;
            gap:8px;
            padding:12px 14px 8px;
            flex-shrink:0;
        }
        .ac-head-icon{
            width:26px;height:26px;border-radius:8px;
            background:linear-gradient(145deg,var(--accent),#FBBF24);
            display:flex;align-items:center;justify-content:center;
        }
        .ac-head-icon svg{width:14px;height:14px;color:#fff}
        .ac-head-title{font-size:14px;font-weight:700;color:var(--gray-900);flex:1}
        .ac-head-badge{font-size:9.5px;font-weight:600;padding:1.5px 6px;border-radius:5px;background:var(--accent-light);color:#B45309}

        .ac-input-row{
            display:flex;gap:6px;padding:0 14px 10px;flex-shrink:0;
        }
        .ac-input{
            flex:1;height:34px;border-radius:8px;border:1.5px solid var(--gray-200);
            background:var(--gray-50);padding:0 10px;font-size:12.5px;font-family:inherit;
            color:var(--gray-900);outline:none;transition:all .2s;
        }
        .ac-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px var(--primary-50)}
        .ac-input::placeholder{color:var(--gray-400)}
        .ac-gen-btn{
            height:34px;padding:0 12px;border:none;border-radius:8px;
            background:var(--primary);color:#fff;font-size:12.5px;font-weight:600;
            cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0;white-space:nowrap;
        }
        .ac-gen-btn:active{transform:scale(.95);opacity:.85}
        .ac-gen-btn:disabled{opacity:.4;pointer-events:none}

        .ac-scroll{
            flex:1;overflow-y:auto;padding:0 14px 12px;-webkit-overflow-scrolling:touch;
        }
        .ac-scroll::-webkit-scrollbar{display:none}

        .ac-cards-label{font-size:11px;color:var(--gray-400);margin-bottom:8px}
        .ac-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
        .ac-card{
            padding:10px 9px;background:var(--gray-50);border:1.5px solid var(--gray-100);
            border-radius:10px;cursor:pointer;text-align:left;font-family:inherit;
            transition:all .2s;display:flex;align-items:flex-start;gap:7px;
        }
        .ac-card:active{transform:scale(.97);border-color:var(--primary);background:var(--primary-50)}
        .ac-card-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
        .ac-card-icon svg{width:12px;height:12px}
        .ac-card-text{font-size:11px;font-weight:500;color:var(--gray-600);line-height:1.35}

        /* Result view in assistant card */
        .ac-back{
            display:inline-flex;align-items:center;gap:3px;background:none;border:none;
            color:var(--primary);font-size:11.5px;font-weight:600;cursor:pointer;
            font-family:inherit;padding:3px 0;margin-bottom:8px;transition:opacity .15s;
        }
        .ac-back:active{opacity:.6}
        .ac-back svg{width:12px;height:12px}

        .ac-template{
            width:100%;min-height:200px;max-height:260px;border-radius:10px;
            border:1.5px solid var(--gray-200);padding:10px;font-size:12px;
            font-family:inherit;color:var(--gray-700);line-height:1.65;
            resize:none;outline:none;background:var(--gray-50);transition:border-color .2s,box-shadow .2s;
        }
        .ac-template:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-50);background:#fff}

        .ac-result-actions{display:flex;gap:6px;margin-top:8px}
        .ac-act{
            flex:1;height:32px;border:none;border-radius:8px;font-size:12px;font-weight:600;
            cursor:pointer;font-family:inherit;transition:all .15s;display:flex;
            align-items:center;justify-content:center;gap:4px;
        }
        .ac-act:active{transform:scale(.96)}
        .ac-act svg{width:12px;height:12px}
        .ac-act.copy-a{background:var(--gray-100);color:var(--gray-600)}
        .ac-act.send-a{background:var(--primary);color:#fff}
        .ac-act.send-a:active{opacity:.85}

        /* ── Input Bar ── */
        .input-bar{flex-shrink:0;padding:10px 16px;padding-bottom:calc(10px + var(--safe-b));background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(226,232,240,.5);display:flex;align-items:flex-end;gap:8px}
        .input-plus{width:38px;height:38px;border:none;background:var(--gray-100);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-500);transition:all .15s;flex-shrink:0}
        .input-plus:active{transform:scale(.9);background:var(--gray-200)}
        .input-plus svg{width:20px;height:20px}
        .input-wrap{flex:1;background:var(--gray-100);border-radius:14px;border:1.5px solid transparent;display:flex;align-items:flex-end;padding:0 4px 0 14px;transition:all .2s;max-height:120px}
        .input-wrap:focus-within{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-50)}
        .input-wrap textarea{flex:1;border:none;background:none;font-size:14px;font-family:inherit;color:var(--gray-900);padding:9px 0;outline:none;resize:none;line-height:1.5;max-height:96px;overflow-y:auto}
        .input-wrap textarea::-webkit-scrollbar{display:none}
        .input-wrap textarea::placeholder{color:var(--gray-400)}

        .voice-btn{width:38px;height:38px;border:none;background:var(--gray-100);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-500);transition:all .15s;flex-shrink:0}
        .voice-btn:active{transform:scale(.9)}
        .voice-btn svg{width:19px;height:19px}
        .voice-btn.recording{color:var(--rose);background:var(--rose-light);animation:voice-pulse 1.2s ease-in-out infinite}
        @keyframes voice-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

        .input-send{width:38px;height:38px;border:none;background:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;opacity:.4;pointer-events:none;transition:all .2s;flex-shrink:0}
        .input-send.active{opacity:1;pointer-events:auto}
        .input-send:active{transform:scale(.88)}
        .input-send svg{width:17px;height:17px}

        /* ── Drawer ── */
        .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
        .drawer-overlay.open{opacity:1;pointer-events:auto}
        .drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:360px;background:var(--white);z-index:91;transform:translateX(-100%);transition:transform .32s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
        .drawer.open{transform:translateX(0)}
        .drawer-head{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
        .drawer-title{font-size:17px;font-weight:700;color:var(--gray-900)}
        .drawer-new-btn{font-size:13px;font-weight:600;color:var(--primary);background:none;border:none;cursor:pointer;font-family:inherit;padding:6px 0}
        .drawer-new-btn:active{opacity:.6}

        /* ── Folder Bar ── */
        .folder-bar{flex-shrink:0;padding:0 20px;margin-bottom:10px;}
        .folder-scroll{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none;}
        .folder-scroll::-webkit-scrollbar{display:none}
        .folder-chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:100px;border:1.5px solid var(--gray-200);background:var(--gray-50);cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;color:var(--gray-600);transition:all .2s;white-space:nowrap;}
        .folder-chip:active{transform:scale(.95)}
        .folder-chip.active{border-color:var(--primary);background:var(--primary-50);color:var(--primary);font-weight:600}
        .folder-chip svg{width:13px;height:13px}
        .folder-chip .chip-count{font-size:10px;font-weight:700;background:var(--gray-200);color:var(--gray-500);border-radius:100px;padding:0 6px;min-width:18px;text-align:center;line-height:16px;}
        .folder-chip.active .chip-count{background:var(--primary-200);color:var(--primary)}
        .folder-expand-btn{flex-shrink:0;padding:6px 10px;border:1.5px dashed var(--gray-300);border-radius:100px;background:none;cursor:pointer;font-family:inherit;font-size:11.5px;color:var(--gray-400);display:none;align-items:center;gap:4px;white-space:nowrap;}
        .folder-expand-btn:active{background:var(--gray-50)}
        .folder-expand-btn svg{width:12px;height:12px}
        .folder-bar.expandable .folder-expand-btn{display:flex}
        .folder-bar.expanded .folder-scroll{flex-wrap:wrap;overflow-x:visible}
        .folder-bar.expanded .folder-expand-btn{display:none}

        .drawer-search{margin:0 20px 16px;position:relative}
        .drawer-search input{width:100%;height:38px;border-radius:10px;border:1.5px solid var(--gray-200);background:var(--gray-50);padding:0 14px 0 36px;font-size:13px;font-family:inherit;color:var(--gray-900);outline:none;transition:all .2s}
        .drawer-search input:focus{border-color:var(--primary);background:#fff}
        .drawer-search input::placeholder{color:var(--gray-400)}
        .drawer-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--gray-400)}
        .drawer-list{flex:1;overflow-y:auto;padding:0 20px 20px}
        .drawer-section-label{font-size:11.5px;font-weight:600;color:var(--gray-400);margin-bottom:8px;padding-left:2px;text-transform:uppercase;letter-spacing:.04em}
        .drawer-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 0;color:var(--gray-400);font-size:13px;gap:8px}
        .drawer-empty svg{width:40px;height:40px;opacity:.4}

        /* ── Drawer Item + Swipe ── */
        .swipe-wrap{position:relative;overflow:hidden;border-radius:var(--radius-sm);margin-bottom:2px}
        .swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:0}
        .swipe-act-btn{display:flex;align-items:center;justify-content:center;border:none;font-size:11.5px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;width:62px;flex-direction:column;gap:2px}
        .swipe-act-btn svg{width:16px;height:16px}
        .swipe-act-btn.pin-a{background:var(--accent)}
        .swipe-act-btn.folder-a{background:var(--primary)}
        .swipe-act-btn.del-a{background:var(--rose)}
        .swipe-content{position:relative;z-index:1;background:var(--white);will-change:transform}
        .drawer-item{display:flex;align-items:center;gap:12px;padding:12px 10px;cursor:pointer;transition:background .15s}
        .drawer-item:active{background:var(--gray-50)}
        .drawer-item-icon{width:36px;height:36px;border-radius:10px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .drawer-item-icon svg{width:17px;height:17px;color:var(--gray-400)}
        .drawer-item-info{flex:1;min-width:0}
        .drawer-item-title{font-size:13.5px;font-weight:600;color:var(--gray-900);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .drawer-item-preview{font-size:11.5px;color:var(--gray-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .drawer-item-time{font-size:10.5px;color:var(--gray-300);flex-shrink:0}

        /* ── Bottom Sheet ── */
        .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
        .sheet-overlay.open{opacity:1;pointer-events:auto}
        .bottom-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--white);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:81;padding:12px 24px;padding-bottom:calc(20px + var(--safe-b));transition:transform .35s cubic-bezier(.22,1,.36,1)}
        .bottom-sheet.open{transform:translateX(-50%) translateY(0)}
        .sheet-handle{width:36px;height:4px;background:var(--gray-300);border-radius:2px;margin:0 auto 20px}
        .sheet-options{display:flex;justify-content:space-around}
        .sheet-opt{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:none;background:none;font-family:inherit;padding:8px 12px;border-radius:var(--radius-sm);transition:all .15s}
        .sheet-opt:active{transform:scale(.92);background:var(--gray-50)}
        .sheet-opt-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
        .sheet-opt-icon svg{width:24px;height:24px}
        .sheet-opt-label{font-size:12px;font-weight:500;color:var(--gray-600)}

        /* ── Confirm Modal ── */
        .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
        .confirm-overlay.open{opacity:1;pointer-events:auto}
        .confirm-card{background:var(--white);border-radius:20px;padding:28px 24px 20px;width:280px;text-align:center;transform:scale(.9);transition:transform .25s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-lg)}
        .confirm-overlay.open .confirm-card{transform:scale(1)}
        .confirm-icon{width:48px;height:48px;border-radius:50%;background:var(--accent-light);color:#B45309;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
        .confirm-icon svg{width:24px;height:24px}
        .confirm-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:8px}
        .confirm-text{font-size:13.5px;color:var(--gray-500);line-height:1.5;margin-bottom:22px}
        .confirm-btns{display:flex;gap:10px}
        .confirm-btn{flex:1;height:42px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
        .confirm-btn:active{transform:scale(.96)}
        .confirm-btn.cancel{background:var(--gray-100);color:var(--gray-600)}
        .confirm-btn.ok{background:var(--gray-900);color:#fff}

        /* ── Name Dialog (new folder) ── */
        .name-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:155;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
        .name-overlay.open{opacity:1;pointer-events:auto}
        .name-card{background:var(--white);border-radius:20px;padding:24px;width:280px;transform:scale(.9);transition:transform .25s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-lg)}
        .name-overlay.open .name-card{transform:scale(1)}
        .name-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:16px;text-align:center}
        .name-input{width:100%;height:42px;border-radius:12px;border:1.5px solid var(--gray-200);background:var(--gray-50);padding:0 14px;font-size:14px;font-family:inherit;color:var(--gray-900);outline:none;transition:all .2s;margin-bottom:20px}
        .name-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-50)}
        .name-input::placeholder{color:var(--gray-400)}
        .name-btns{display:flex;gap:10px}
        .name-btn{flex:1;height:42px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
        .name-btn:active{transform:scale(.96)}
        .name-btn.cancel{background:var(--gray-100);color:var(--gray-600)}
        .name-btn.ok{background:var(--gray-900);color:#fff}

        /* ── Bookmark Sheet ── */
        .bm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:130;opacity:0;pointer-events:none;transition:opacity .25s}
        .bm-overlay.open{opacity:1;pointer-events:auto}
        .bm-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--white);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:131;display:flex;flex-direction:column;max-height:75vh;transition:transform .35s cubic-bezier(.22,1,.36,1)}
        .bm-sheet.open{transform:translateX(-50%) translateY(0)}
        .bm-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 12px;flex-shrink:0}
        .bm-title{font-size:17px;font-weight:700;color:var(--gray-900)}
        .bm-close{width:32px;height:32px;border:none;background:var(--gray-100);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-500)}
        .bm-close:active{background:var(--gray-200)}
        .bm-close svg{width:16px;height:16px}
        .bm-list{flex:1;overflow-y:auto;padding:0 24px 24px;-webkit-overflow-scrolling:touch}
        .bm-list::-webkit-scrollbar{display:none}
        .bm-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0;color:var(--gray-400);font-size:13px;gap:8px}
        .bm-empty svg{width:36px;height:36px;opacity:.4}
        .bm-item{padding:14px 0;border-bottom:1px solid var(--gray-100);display:flex;flex-direction:column;gap:4px}
        .bm-item:last-child{border-bottom:none}
        .bm-item-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--gray-400)}
        .bm-item-chat{font-size:11px;color:var(--primary);font-weight:500}
        .bm-item-text{font-size:13px;color:var(--gray-700);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .bm-item-time{font-size:10.5px;color:var(--gray-300)}
        .bm-item-actions{display:flex;gap:12px;margin-top:6px}
        .bm-item-act{font-size:11.5px;color:var(--gray-400);background:none;border:none;cursor:pointer;font-family:inherit;padding:0}
        .bm-item-act:active{color:var(--gray-600)}
        .bm-item-act.del{color:var(--rose)}

        /* ── Drawer Bookmark Entry ── */
        .drawer-bookmark-entry{flex-shrink:0;padding:12px 20px;border-top:1px solid var(--gray-100);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s}
        .drawer-bookmark-entry:active{background:var(--gray-50)}
        .drawer-bookmark-entry-icon{width:32px;height:32px;border-radius:8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .drawer-bookmark-entry-icon svg{width:16px;height:16px;color:#B45309}
        .drawer-bookmark-entry-text{font-size:13.5px;font-weight:600;color:var(--gray-900)}
        .drawer-bookmark-entry-count{font-size:11px;color:var(--gray-400);margin-left:auto}

        /* ── Folder Pick Sheet ── */
        .fps-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:120;opacity:0;pointer-events:none;transition:opacity .25s}
        .fps-overlay.open{opacity:1;pointer-events:auto}
        .fps-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--white);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:121;padding:20px 24px;padding-bottom:calc(24px + var(--safe-b));transition:transform .35s cubic-bezier(.22,1,.36,1)}
        .fps-sheet.open{transform:translateX(-50%) translateY(0)}
        .fps-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:16px;text-align:center}
        .fps-list{max-height:280px;overflow-y:auto}
        .fps-list::-webkit-scrollbar{display:none}

        .msg-bubble table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
        .msg-bubble th{background:var(--gray-100);font-weight:600;text-align:left;padding:6px 10px;border:1px solid var(--gray-200)}
        .msg-bubble td{padding:6px 10px;border:1px solid var(--gray-200)}

        .msg-row.user .msg-bubble h1,.msg-row.user .msg-bubble h2,.msg-row.user .msg-bubble h3,.msg-row.user .msg-bubble h4{color:#fff}

        .msg-row.user .msg-bubble pre{background:rgba(255,255,255,.08)}
        .msg-row.user .msg-bubble pre code{color:var(--gray-300)}

<body>
<div class="app">

    <!-- ═══ Nav ═══ -->

        <div style="display:flex;align-items:center;gap:2px">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>

            <button class="nav-btn" onclick="toggleDrawer(true)" aria-label="历史记录">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>

        </div>

        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages"></div>

            <div class="ac-toggle" onclick="toggleAssistantCard()" aria-label="展开/收起提问助手">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>

                        </div>

                        <div id="acResultView" style="display:none">

                </div>

        </div>

    <div class="name-overlay" id="nameOverlay">
        <div class="name-card">

    </div>

    <div class="bm-sheet" id="bmSheet">
        <div class="bm-head">

            <button class="bm-close" onclick="closeBookmarkSheet()">

            </button>
        </div>
        <div class="bm-list" id="bmList"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
</div>

        { keys:['项目案例','star','撰写项目','写项目','案例撰写'], resp:'项目案例撰写' },
        { keys:['本周','这周','周计划','周安排','一周'], resp:'本周计划安排' },
        { keys:['行业','趋势','市场趋势','方向分析','前景'], resp:'行业趋势分析' },
        { keys:['简历','诊断简历','cv','resume'], resp:'AI 简历诊断' },
        { keys:['调研','市场调研','调研报告','市场报告'], resp:'市场调研报告' },
        { keys:['面试','模拟面试','面经','面题'], resp:'模拟面试练习' },
        { keys:['竞争力','岗位竞争','竞争分析'], resp:'岗位竞争力' },
        { keys:['路径','路线','规划路径','职业规划','长远'], resp:'职业路径规划' },
        { keys:['海外','出国','国外','新加坡','美国','日本','海外机会'], resp:'海外机会分析' },
    ];
    /* Deep-tab keyword boost */
    const deepOnly = ['简历','诊断','调研','面试','竞争力','路径规划','海外'];
    if(tab === 'deep'){
        for(const m of kwMap){
            if(deepOnly.some(k => m.keys.includes(k)) && t.includes(m.keys.find(k => t.includes(k)))){
                return MOCK_RESPONSES[m.resp] || MOCK_RESPONSES['default'];
            }
        }
    }
    /* General match */
    for(const m of kwMap){
        if(m.keys.some(k => t.includes(k))){
            return MOCK_RESPONSES[m.resp] || MOCK_RESPONSES['default'];
        }
    }
    /* Tab-based fallback */
    if(tab === 'deep'){
        return MOCK_RESPONSES['岗位竞争力'];
    }
    return MOCK_RESPONSES['default'];
}

const AI_BM_KEY = 'cos_ai_bookmarks';
function readAiBookmarks(){
    try{
        const v = JSON.parse(localStorage.getItem(AI_BM_KEY) || '[]');
        return Array.isArray(v) ? v : [];
    }catch(e){ return []; }
}
function writeAiBookmarks(list){
    try{ localStorage.setItem(AI_BM_KEY, JSON.stringify(list)); }
    catch(e){ console.warn('[ai-chat] 收藏写入失败', e); }
}
function upsertAiBookmark(entry, on){
    const list = readAiBookmarks();
    const idx = list.findIndex(b => b.chatId === entry.chatId && b.msgIdx === entry.msgIdx);
    if(on){
        if(idx >= 0) list[idx] = Object.assign(list[idx], entry);
        else list.unshift(entry);
    }else{
        if(idx >= 0) list.splice(idx, 1);
    }
    writeAiBookmarks(list);
}
/* 启动时把已收藏标记写回 chatHistory，按钮高亮与抽屉计数才正确 */
(function restoreAiBookmarks(){
    try{
        readAiBookmarks().forEach(function(b){
            const chat = chatHistory.find(function(c){ return c.id === b.chatId; });
            if(chat && chat.messages && chat.messages[b.msgIdx]){
                chat.messages[b.msgIdx].bookmark = true;
            }
        });
    }catch(e){}
})();

    /* Pre-process Career-OS custom syntax into HTML that marked will pass through */
    let h = text;
    h = h.replace(/^[─]{4,}$/gm, '<div class="fmt-divider"></div>');
    h = h.replace(/^[□☐]\s/gm, '<span class="fmt-ck-empty"></span> ');
    h = h.replace(/^[✅☑️]/gm, '<span class="fmt-ck-done">$&</span> ');
    h = h.replace(/^([🔴🟡🟢⚠️🔄⬜📍💡📋📊🔍📝📅📈🎭⚡🗺️🌍👤🎯💼🎨📚✨👋🇺🇸🇸🇬🇯🇵])/gm, '<span class="fmt-status">$1</span> ');
    h = h.replace(/([█░]{4,})/g, '<code class="fmt-bar">$1</code>');
    /* Use marked for full Markdown if available */
    if(typeof marked !== 'undefined'){
        marked.setOptions({ breaks:true, gfm:true });
        /* 安全：先转义原始HTML标签，再让marked处理Markdown */
        h = h.replace(/<(?!\/?(div|span|code|strong|em|a|br|p|ul|ol|li|h[1-4]|blockquote|pre|table|thead|tbody|tr|th|td|img)\b)[^>]*>/gi, '');
        return marked.parse(h);
    }
    /* Fallback: basic formatting */
    h = h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h = h.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
    h = h.replace(/^•\s/gm,'<span class="fmt-bullet">•</span> ');
    h = h.replace(/^(\d+)\.\s/gm,'<span class="fmt-num">$1.</span> ');
    h = h.replace(/^→\s/gm,'<span class="fmt-bullet">→</span> ');
    h = h.replace(/\n/g,'<br>');
    return h;
}

/* Typewriter — chunk-aware, speed-adaptive, click-to-skip */
function typeWriterEffect(bubble, html, onComplete){
    /* Pre-split HTML into chunks (each tag or char = one chunk) */
    const chunks=[];
    for(let i=0;i<html.length;){
        if(html[i]==='<'){
            let j=i,inQ=false,qc='';
            while(j<html.length){
                if(!inQ&&(html[j]==='"'||html[j]==="'")){inQ=true;qc=html[j];}
                else if(inQ&&html[j]===qc)inQ=false;
                else if(!inQ&&html[j]==='>'){j++;break;}
                j++;
            }
            chunks.push(html.substring(i,j));i=j;
        }else{chunks.push(html[i]);i++;}
    }
    let idx=0,buffer='';stopTypewriterFlag=false;showStopBtn();
    /* Adaptive speed: faster for long content */
    const speed=chunks.length>200?4:chunks.length>80?7:12;
    function type(){
        if(stopTypewriterFlag||idx>=chunks.length){
            bubble.innerHTML=html;hideStopBtn();scrollToBottom();if(onComplete)onComplete();return;
        }
        buffer+=chunks[idx];idx++;
        bubble.innerHTML=buffer+'<span class="tw-cursor"></span>';scrollToBottom();
        typewriterTimer=setTimeout(type,speed);
    }
    type();
    /* Click / tap to skip */
    bubble._skipHandler=()=>{
        if(idx<chunks.length){
            stopTypewriterFlag=true;
            bubble.removeEventListener('click',bubble._skipHandler);
            bubble.style.cursor='';
        }
    };
    bubble.style.cursor='pointer';
    bubble.addEventListener('click',bubble._skipHandler);
    /* Clean up on complete */
    const origComplete=onComplete;
    onComplete=()=>{bubble.removeEventListener('click',bubble._skipHandler);bubble.style.cursor='';if(origComplete)origComplete();};
}

function saveChat(userText, aiText){
    const existing=chatHistory.find(c=>c.id===currentChatId);
    if(existing){existing.messages.push({role:'user',text:userText},{role:'ai',text:aiText});existing.time='刚刚';existing.preview=aiText.replace(/\*\*/g,'').replace(/[─█░]/g,'').replace(/\n/g,' ').slice(0,32)+'…';}
    else{const title=userText.length>16?userText.slice(0,16)+'…':userText;const preview=aiText.replace(/\*\*/g,'').replace(/[─█░]/g,'').replace(/\n/g,' ').slice(0,32)+'…';chatHistory.unshift({id:currentChatId,title,preview,time:'刚刚',pinned:false,tab:currentTab,folder:null,messages:[{role:'user',text:userText},{role:'ai',text:aiText}]});}
    renderDrawer();
}

function loadChat(chatId,focusIdx){
    const chat=chatHistory.find(c=>c.id===chatId);if(!chat) return;
    toggleDrawer(false);
    currentTab=chat.tab;
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&chat.tab==='basic')||(i===1&&chat.tab==='deep')));
    document.getElementById('chatInitial').classList.add('hidden');
    const container=document.getElementById('chatMessages');container.classList.add('active');container.innerHTML='';currentChatId=chat.id;
    chat.messages.forEach((m,i)=>{
        addMessageInstant(m.role,m.text);
        /* Restore bookmark state */
        if(m.bookmark){
            const rows=container.querySelectorAll('.msg-row');
            const lastRow=rows[rows.length-1];
            if(lastRow){
                const bmBtn=lastRow.querySelector('.msg-act:nth-child(4)');
                if(bmBtn) bmBtn.classList.add('active-bookmark');
            }
        }
    });
    /* 深链定位：?chat=1&msg=1 时滚到那条消息并短暂高亮 */
    const rows=container.querySelectorAll('.msg-row');
    if(typeof focusIdx==='number'&&focusIdx>=0&&rows[focusIdx]){
        scrollToBottom();
        const row=rows[focusIdx];
        setTimeout(function(){
            row.scrollIntoView({block:'center'});
            row.classList.add('deep-focus');
            setTimeout(function(){row.classList.remove('deep-focus');},2400);
        },80);
        return;
    }
    scrollToBottom();
}

        chipsHTML += `<button class="folder-chip${isActive?' active':''}" onclick="selectFolder('${f}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>${f}<span class="chip-count">${counts[f]||0}</span></button>`;
    });
    bar.innerHTML = `<div class="folder-scroll">${chipsHTML}</div><button class="folder-expand-btn" onclick="toggleFolderExpand()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>展开</button>`;
    bar.classList.toggle('expandable', isExpandable); bar.classList.remove('expanded');
    requestAnimationFrame(()=>{const active=bar.querySelector('.folder-chip.active');if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});});
}

function selectFolder(f){ activeFolder=f; renderFolderBar(); renderDrawer(); }
function toggleFolderExpand(){ document.getElementById('folderBar').classList.toggle('expanded'); }

/* ── Drawer List ── */

function getFilteredChats(){ if(activeFolder==='全部') return chatHistory; return chatHistory.filter(c=>c.folder===activeFolder); }

function renderDrawer(){
    const list=document.getElementById('drawerList');const filtered=getFilteredChats();const pinned=filtered.filter(c=>c.pinned);const recent=filtered.filter(c=>!c.pinned);
    let html='';
    if(pinned.length){html+='<div class="drawer-section-label">置顶</div>';pinned.forEach(c=>html+=swipeItemHTML(c));}
    if(recent.length){html+='<div class="drawer-section-label" style="margin-top:16px">最近</div>';recent.forEach(c=>html+=swipeItemHTML(c));}
    if(!pinned.length&&!recent.length){html='<div class="drawer-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>暂无对话记录</span></div>';}
    list.innerHTML=html;list.querySelectorAll('.swipe-wrap').forEach(w=>initSwipe(w));
}

function swipeItemHTML(c){
    return `<div class="swipe-wrap" data-id="${c.id}"><div class="swipe-actions"><button class="swipe-act-btn pin-a" onclick="event.stopPropagation();pinChat(${c.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76z"/></svg><span>置顶</span></button><button class="swipe-act-btn folder-a" onclick="event.stopPropagation();openFolderPicker(${c.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span>归类</span></button><button class="swipe-act-btn del-a" onclick="event.stopPropagation();deleteChat(${c.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg><span>删除</span></button></div><div class="swipe-content"><div class="drawer-item" onclick="loadChat(${c.id})"><div class="drawer-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="drawer-item-info"><div class="drawer-item-title">${c.title}</div><div class="drawer-item-preview">${c.preview}</div></div><span class="drawer-item-time">${c.time}</span></div></div></div>`;
}

/* ── Swipe ── */
function initSwipe(wrap){
    const content=wrap.querySelector('.swipe-content');
    let startX=0,startY=0,currentX=0,isOpen=false,moved=false,swiping=null;
    content.addEventListener('touchstart',e=>{
        closeAllSwipes(wrap);
        startX=e.touches[0].clientX;
        startY=e.touches[0].clientY;
        currentX=isOpen?-186:0;
        moved=false;
        swiping=null;
        content.style.transition='none';
    },{passive:true});
    content.addEventListener('touchmove',e=>{
        const dx=e.touches[0].clientX-startX;
        const dy=e.touches[0].clientY-startY;
        /* Determine swipe direction on first significant move */
        if(!swiping && (Math.abs(dx)>8||Math.abs(dy)>8)){
            swiping=Math.abs(dx)>Math.abs(dy)?'h':'v';
        }
        if(swiping==='h'){
            e.preventDefault();
            moved=true;
            const diff=dx+currentX;
            const cl=Math.min(0,Math.max(diff,-186));
            content.style.transform=`translateX(${cl}px)`;
        }
    },{passive:false});
    content.addEventListener('touchend',()=>{
        if(!moved||swiping!=='h')return;
        content.style.transition='transform .25s cubic-bezier(.22,1,.36,1)';
        const cur=parseFloat((content.style.transform||'').replace(/[^-\d.]/g,''))||0;
        if(cur<-50){content.style.transform='translateX(-186px)';isOpen=true;}
        else{content.style.transform='translateX(0)';isOpen=false;}
    },{passive:true});
}
function closeAllSwipes(except){document.querySelectorAll('.swipe-wrap').forEach(w=>{if(w===except)return;const c=w.querySelector('.swipe-content');c.style.transition='transform .25s cubic-bezier(.22,1,.36,1)';c.style.transform='translateX(0)';});}

/* ── Drawer Actions ── */
async function pinChat(id){const chat=chatHistory.find(c=>c.id===id);if(!chat)return;chat.pinned=!chat.pinned;renderDrawer();showToast(chat.pinned?'📌 已置顶':'已取消置顶');}

function openFolderPicker(id){
    folderPickTargetId=id;const list=document.getElementById('fpsList');const realFolders=folders.filter(f=>f!=='全部');let html='';
    realFolders.forEach(f=>{const count=chatHistory.filter(c=>c.folder===f).length;const color=f==='学习规划'?'var(--primary)':f==='作品集'?'var(--indigo)':f==='求职准备'?'var(--4)':'var(--sky)';const bg=f==='学习规划'?'var(--primary-50)':f==='作品集'?'var(--indigo-light)':f==='求职准备'?'var(--accent-light)':'var(--sky-light)';
    html+=`<button class="fps-item" onclick="pickFolder('${f}')"><div class="fps-item-icon" style="background:${bg};color:${color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></div><span class="fps-item-name">${f}</span><span class="fps-item-count">${count} 条对话</span></button>`;});
    list.innerHTML=html;document.getElementById('fpsOverlay').classList.add('open');document.getElementById('fpsSheet').classList.add('open');
}

function closeFolderPicker(){document.getElementById('fpsOverlay').classList.remove('open');document.getElementById('fpsSheet').classList.remove('open');folderPickTargetId=null;}

function pickFolder(folderName){
    if(!folderPickTargetId) return;
    const chat=chatHistory.find(c=>c.id===folderPickTargetId);
    if(chat){chat.folder=folderName;renderDrawer();renderFolderBar();showToast(`📁 已归类到「${folderName}」`);}
    closeFolderPicker();
}

async function createFolderInline(){
    const name = await showNameDialog('新建文件夹', '请输入文件夹名称');
    if(!name || !name.trim()) return;
    const trimmed = name.trim();
    if(folders.includes(trimmed)){showToast('文件夹已存在');return;}
    folders.push(trimmed);
    renderFolderBar(); renderDrawer();
    if(folderPickTargetId) openFolderPicker(folderPickTargetId);
    showToast(`✓ 已创建文件夹「${trimmed}」`);
}

async function createFolderFromDrawer(){
    const name = await showNameDialog('新建文件夹', '请输入文件夹名称');
    if(!name || !name.trim()) return;
    const trimmed = name.trim();
    if(folders.includes(trimmed)){showToast('文件夹已存在');return;}
    folders.push(trimmed);
    renderFolderBar(); renderDrawer();
    showToast(`✓ 已创建文件夹「${trimmed}」`);
}

async function deleteChat(id){
    const ok=await showConfirm('删除对话','确定要删除这条对话记录吗？此操作不可撤销。');
    if(!ok) return;
    chatHistory=chatHistory.filter(c=>c.id!==id);
    if(currentChatId===id){currentChatId=null;renderInitial();}
    renderDrawer();showToast('已删除');
}

/* ── Search ── */
function filterDrawer(query){
    const q=query.trim().toLowerCase();
    document.querySelectorAll('.swipe-wrap').forEach(wrap=>{const title=wrap.querySelector('.drawer-item-title').textContent.toLowerCase();const preview=wrap.querySelector('.drawer-item-preview').textContent.toLowerCase();wrap.style.display=(!q||title.includes(q)||preview.includes(q))?'block':'none';});
    document.querySelectorAll('.drawer-section-label').forEach(label=>{let next=label.nextElementSibling;let has=false;while(next&&!next.classList.contains('drawer-section-label')){if(next.style.display!=='none')has=true;next=next.nextElementSibling;}label.style.display=has?'block':'none';});
    const emptyEl=document.querySelector('.drawer-empty');const visCount=document.querySelectorAll('.swipe-wrap[style*="block"],.swipe-wrap:not([style])').length;
    if(visCount===0&&!emptyEl){const e=document.createElement('div');e.className='drawer-empty';e.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>未找到匹配的记录</span>';document.getElementById('drawerList').appendChild(e);}else if(visCount>0&&emptyEl){emptyEl.remove();}
}

/* ══════════════════════════════════════
   BOTTOM SHEET / VOICE
   ══════════════════════════════════════ */

function toggleSheet(open){document.getElementById('bottomSheet').classList.toggle('open',open);document.getElementById('sheetOverlay').classList.toggle('open',open);}
function handleAttach(type){
    toggleSheet(false);
    if(type==='拍照'){document.getElementById('cameraInput').click();}
    else if(type==='照片'){document.getElementById('photoInput').click();}
    else if(type==='文件'){document.getElementById('fileInput').click();}
}

/* Handle file selection from camera / photo / file inputs */
function handleFileSelected(input, source){
    const files=input.files;
    if(!files||!files.length){return;}
    for(let i=0;i<files.length;i++){
        const file=files[i];
        const isImage=file.type.startsWith('image/');
        if(isImage){
            const reader=new FileReader();
            reader.onload=function(e){
                sendMediaMessage('image', e.target.result, file.name, file.size);
            };
            reader.readAsDataURL(file);
        }else{
            sendMediaMessage('file', null, file.name, file.size);
        }
    }
    /* Reset input so same file can be selected again */
    input.value='';
}

/* Send a media/file message into the chat */
function sendMediaMessage(type, dataUrl, name, size){
    if(isTyping) return;
    if(!document.getElementById('chatMessages').classList.contains('active')){
        document.getElementById('chatInitial').classList.add('hidden');
        document.getElementById('chatMessages').classList.add('active');
        document.getElementById('chatMessages').innerHTML='';
        currentChatId=Date.now();
    }
    const container=document.getElementById('chatMessages');
    const row=document.createElement('div');
    row.className='msg-row user';
    let contentHTML='';
    if(type==='image'){
        contentHTML=`<div class="msg-bubble"><img src="${dataUrl}" style="max-width:200px;max-height:200px;border-radius:10px;display:block;margin-bottom:4px;" alt="${escapeHtml(name)}"><div style="font-size:11px;opacity:.7;">${escapeHtml(name)}</div></div>`;
    }else{
        const sizeStr=size<1024?size+'B':size<1048576?(size/1024).toFixed(1)+'KB':(size/1048576).toFixed(1)+'MB';
        contentHTML=`<div class="msg-bubble" style="display:flex;align-items:center;gap:10px;"><div style="width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></div><div><div style="font-size:13px;font-weight:500;">${escapeHtml(name)}</div><div style="font-size:11px;opacity:.6;">${sizeStr}</div></div></div>`;
    }
    row.innerHTML=`<div class="msg-avatar user-av">林</div><div class="msg-content">${contentHTML}${buildActionsHTML()}</div>`;
    container.appendChild(row);scrollToBottom();

    /* AI response about the file */
    showTyping();
    const aiText=type==='image'
        ?`我收到了你发送的图片「${name}」📸\n\n你可以告诉我：\n1. 需要我分析图片中的内容吗？\n2. 这是你的作品集项目截图吗？我可以帮你撰写项目描述。\n3. 需要针对图片内容进行职业相关的分析吗？`
        :`我收到了你上传的文件「${name}」📎\n\n你可以告诉我：\n1. 需要我帮你分析或总结文件内容吗？\n2. 这是简历文件吗？我可以帮你诊断优化。\n3. 需要基于文件内容提供职业建议吗？`;
    setTimeout(()=>{hideTyping();scrollToBottom();addMessage('ai',aiText,false);saveChat(`[附件] ${name}`,aiText);},800+Math.random()*600);
}

function initVoice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){document.getElementById('voiceBtn').style.display='none';return;}
    recognition=new SR();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;
    recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;const ta=document.getElementById('msgInput');ta.value=t;autoResize(ta);toggleSend();};
    recognition.onend=()=>{isRecording=false;updateVoiceBtn();};
    recognition.onerror=e=>{isRecording=false;updateVoiceBtn();if(e.error!=='aborted'&&e.error!=='no-speech')showToast('语音识别出错，请重试');};
}
function toggleVoice(){if(!recognition){showToast('当前浏览器不支持语音输入');return;}if(isRecording)recognition.stop();else{try{recognition.start();isRecording=true;}catch(e){return;}}updateVoiceBtn();}
function updateVoiceBtn(){document.getElementById('voiceBtn').classList.toggle('recording',isRecording);}

/* ── 场景参数：从面试题库页带 ?scene=interview 进入时，自动开启 AI 模拟面试 ── */
function initScene(){
    var m = location.search.match(/[?&]scene=([^&]+)/);
    if(!m || m[1]!=='interview') return;
    setTimeout(function(){
        var input=document.getElementById('msgInput');
        if(input && typeof sendTextAsUser==='function'){
            showToast('🎤 已进入 AI 模拟面试');
            sendTextAsUser('帮我进行模拟面试');
        }
    }, 600);
}

/* ── 深链：从「我的-收藏夹」点 AI 回答进来时，直接定位到当时那条消息（?chat=1&msg=1） ── */
function initDeepLink(){
    var q=location.search||'';
    var cm=q.match(/[?&]chat=([^&]+)/);
    if(!cm) return;
    var chatId=parseInt(decodeURIComponent(cm[1]),10);
    if(isNaN(chatId)) return;
    var mm=q.match(/[?&]msg=([^&]+)/);
    var msgIdx=null;
    if(mm){
        var parsed=parseInt(decodeURIComponent(mm[1]),10);
        if(!isNaN(parsed)&&parsed>=0) msgIdx=parsed;
    }
    if(!chatHistory.some(function(c){return c.id===chatId;})) return;
    loadChat(chatId,msgIdx);
}

/* ══════════════════════════════════════
   INIT
   ══════════════════════════════════════ */

initVoice();
renderInitial();
renderAcCards();
initScene();
initDeepLink();
</script>

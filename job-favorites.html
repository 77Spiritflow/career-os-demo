<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>岗位信息收藏夹 · Career OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --primary: #0F766E; --primary-hover: #0D6B63; --primary-light: #14B8A6;
    --primary-50: #F0FDFA; --primary-100: #CCFBF1;
    --indigo: #4F46E5; --indigo-light: #EEF2FF;
    --accent: #F59E0B; --accent-light: #FEF3C7;
    --sky: #0284C7; --sky-light: #E0F2FE;
    --green: #059669; --green-light: #D1FAE5;
    --rose: #E11D48; --rose-light: #FFE4E6;
    --violet: #7C3AED; --violet-light: #EDE9FE;
    --white: #FFFFFF;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0; --gray-300: #CBD5E1;
    --gray-400: #94A3B8; --gray-500: #64748B; --gray-600: #475569; --gray-900: #0F172A;
    --radius-lg: 16px; --radius-md: 12px; --radius-sm: 10px;
    --shadow-sm: 0 1px 3px rgba(15,23,42,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:430px;width:100%;min-height:100vh;background:var(--gray-50);margin:0 auto;position:relative;padding-bottom:40px}
.top-nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(226,232,240,.5)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;padding:4px 0}
.nav-back:active{color:var(--gray-900)}
.nav-back svg{width:18px;height:18px}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--gray-900)}
.nav-count{position:absolute;right:16px;font-size:12px;color:var(--gray-400);font-weight:500}
.page{padding:16px 16px 0}
.section{margin-bottom:18px}
.section-title{font-size:13px;font-weight:700;color:var(--gray-900);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title svg{width:15px;height:15px;color:var(--primary)}

/* ── 添加按钮 ── */
.add-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;border:none;border-radius:var(--radius-md);padding:13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.25);transition:all .2s;margin-bottom:14px}
.add-btn:active{transform:scale(.97)}
.add-btn svg{width:17px;height:17px}

/* ── 搜索与筛选 ── */
.search-wrap{display:flex;gap:8px;margin-bottom:12px}
.search-box{flex:1;display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);padding:9px 12px}
.search-box:focus-within{border-color:var(--primary)}
.search-box svg{width:15px;height:15px;color:var(--gray-400);flex-shrink:0}
.search-box input{flex:1;border:none;outline:none;font-size:13px;font-family:inherit;color:var(--gray-900);background:transparent}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 14px;font-size:12px;font-weight:500;color:var(--gray-500);background:#fff;border:1px solid var(--gray-200);border-radius:99px;cursor:pointer;transition:all .2s;font-family:inherit}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

/* ── 岗位卡片 ── */
.job-list{display:flex;flex-direction:column;gap:10px}
.job-card{background:#fff;border-radius:var(--radius-md);padding:14px;border:1px solid var(--gray-100);box-shadow:var(--shadow-sm);animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
.job-card-top{display:flex;align-items:flex-start;gap:10px}
.job-logo{width:38px;height:38px;border-radius:11px;background:var(--primary-50);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.job-main{flex:1;min-width:0}
.job-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.job-title{font-size:14px;font-weight:700;color:var(--gray-900)}
.status-badge{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600}
.status-badge.watching{background:var(--sky-light);color:var(--sky)}
.status-badge.applied{background:var(--accent-light);color:#B45309}
.status-badge.interview{background:var(--indigo-light);color:var(--indigo)}
.status-badge.offer{background:var(--green-light);color:var(--green)}
.status-badge.closed{background:var(--gray-100);color:var(--gray-400)}
.job-company{font-size:12px;color:var(--gray-500);margin-top:4px}
.job-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;font-size:11.5px;color:var(--gray-400)}
.job-meta span{display:flex;align-items:center;gap:3px}
.job-meta svg{width:12px;height:12px}
.job-note{display:none;margin-top:10px;padding:10px 12px;background:var(--gray-50);border-radius:var(--radius-sm);font-size:12.5px;color:var(--gray-600);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.job-card.show-note .job-note{display:block}
.job-card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100)}
.job-act{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;padding:5px 8px;border-radius:8px;transition:all .2s}
.job-act:active{background:var(--gray-100)}
.job-act svg{width:14px;height:14px}
.job-act.link{color:var(--primary)}
.job-act.edit{color:var(--primary)}
.job-act.del{color:var(--rose)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 20px;color:var(--gray-300)}
.empty svg{width:42px;height:42px}
.empty p{font-size:13px;color:var(--gray-400);text-align:center;line-height:1.7}

/* ── 弹窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:0 24px;opacity:0;transition:opacity .25s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:20px;transform:scale(.92);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.modal-overlay.show .modal-box{transform:scale(1)}
.modal-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--gray-500);margin-bottom:6px}
.form-input{width:100%;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;background:var(--white);color:var(--gray-900);transition:border-color .2s;outline:none}
.form-input:focus{border-color:var(--primary)}
textarea.form-input{resize:none;min-height:72px;line-height:1.6}
.status-chips{display:flex;gap:6px;flex-wrap:wrap}
.status-chip{flex-shrink:0;padding:6px 12px;font-size:12px;font-weight:500;color:var(--gray-500);background:var(--gray-100);border:none;border-radius:99px;cursor:pointer;font-family:inherit;transition:all .2s}
.status-chip.active{color:#fff;font-weight:600}
.status-chip[data-st="watching"].active{background:var(--sky)}
.status-chip[data-st="applied"].active{background:var(--accent)}
.status-chip[data-st="interview"].active{background:var(--indigo)}
.status-chip[data-st="offer"].active{background:var(--green)}
.status-chip[data-st="closed"].active{background:var(--gray-400)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;box-shadow:0 4px 16px rgba(15,118,110,.25)}
.btn-outline{background:#fff;color:var(--gray-500);border:1.5px solid var(--gray-200)}
.btn-danger{background:var(--rose-light);color:var(--rose)}

/* ── toast ── */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--gray-900);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:400;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:431px){body{background:#E2E8F0}.app{box-shadow:0 0 80px rgba(0,0,0,.08)}}
    </style>
<script>
/* 全局字体大小：设置页「小/中/大」三档全局生效 */
(function(){try{var v=parseInt(localStorage.getItem('cos_fontsize'),10);if(isNaN(v)||v<0||v>2)v=1;var z=[0.92,1,1.12][v];document.documentElement.style.zoom=(z===1?'':String(z));}catch(e){}})();
</script>
</head>
<body>
<div class="app">
    <nav class="top-nav">
        <button class="nav-back" onclick="window.location.href='index.html?tab=prepare'" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span>返回</span>
        </button>
        <span class="nav-title">岗位信息收藏夹</span>
        <span class="nav-count" id="navCount">0 个岗位</span>
    </nav>

    <div class="page">
        <div class="section">
            <button class="add-btn" onclick="openAdd()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                <span>添加岗位</span>
            </button>

            <div class="search-wrap">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input id="searchInput" type="search" placeholder="搜索公司、岗位或城市" oninput="renderList()">
                </div>
            </div>
            <div class="filter-row">
                <button class="filter-chip active" data-st="all" onclick="setFilter(this)">全部</button>
                <button class="filter-chip" data-st="watching" onclick="setFilter(this)">关注中</button>
                <button class="filter-chip" data-st="applied" onclick="setFilter(this)">已投递</button>
                <button class="filter-chip" data-st="interview" onclick="setFilter(this)">面试中</button>
                <button class="filter-chip" data-st="offer" onclick="setFilter(this)">已拿 Offer</button>
                <button class="filter-chip" data-st="closed" onclick="setFilter(this)">已关闭</button>
            </div>
            <div class="job-list" id="jobList"></div>
        </div>
    </div>
</div>

<!-- 添加/编辑弹窗 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">添加岗位</div>
        <div class="form-group">
            <label class="form-label">公司名称 *</label>
            <input class="form-input" id="fCompany" placeholder="如：字节跳动" maxlength="40">
        </div>
        <div class="form-group">
            <label class="form-label">岗位名称 *</label>
            <input class="form-input" id="fTitle" placeholder="如：UX 设计师（实习）" maxlength="60">
        </div>
        <div class="form-group">
            <label class="form-label">工作地点</label>
            <input class="form-input" id="fLocation" placeholder="如：深圳 / 远程" maxlength="30">
        </div>
        <div class="form-group">
            <label class="form-label">招聘链接</label>
            <input class="form-input" id="fLink" type="url" placeholder="https://…" maxlength="200">
        </div>
        <div class="form-group">
            <label class="form-label">求职状态</label>
            <div class="status-chips" id="statusChips">
                <button type="button" class="status-chip active" data-st="watching" onclick="selectStatus(this)">关注中</button>
                <button type="button" class="status-chip" data-st="applied" onclick="selectStatus(this)">已投递</button>
                <button type="button" class="status-chip" data-st="interview" onclick="selectStatus(this)">面试中</button>
                <button type="button" class="status-chip" data-st="offer" onclick="selectStatus(this)">已拿 Offer</button>
                <button type="button" class="status-chip" data-st="closed" onclick="selectStatus(this)">已关闭</button>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">备注</label>
            <textarea class="form-input" id="fNote" placeholder="记录 JD 要点、投递时间、面试进展等"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveJob()">保存</button>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="delModal">
    <div class="modal-box">
        <div class="modal-title">删除岗位</div>
        <p style="font-size:13.5px;color:var(--gray-500);line-height:1.7" id="delJobText"></p>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeDelModal()">取消</button>
            <button class="btn btn-danger" onclick="confirmDel()">删除</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   job-favorites.js | Career OS — 岗位信息收藏夹
   数据存储：localStorage 'cos_job_favs'
   ============================================================ */
var JOB_KEY = 'cos_job_favs';
var STATUS_META = {
    watching: { label:'关注中', cls:'watching' },
    applied:  { label:'已投递', cls:'applied' },
    interview:{ label:'面试中', cls:'interview' },
    offer:    { label:'已拿 Offer', cls:'offer' },
    closed:   { label:'已关闭', cls:'closed' }
};

function getJobs(){ try{ var v=JSON.parse(localStorage.getItem(JOB_KEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function saveJobs(list){ try{ localStorage.setItem(JOB_KEY, JSON.stringify(list)); }catch(e){ console.warn('[job-favorites] 写入失败', e); } }

/* 种子示例数据（首次打开时预置，可编辑/删除） */
var SEED = [
    { id:'job-1001', company:'字节跳动', title:'产品体验设计师（实习）', location:'深圳', link:'', note:'看重用户研究与数据驱动设计能力；面试前补 AB test 案例。', status:'watching', createdAt:Date.now()-86400000*2 },
    { id:'job-1002', company:'腾讯', title:'UI/UX 设计实习生', location:'深圳', link:'', note:'作品集需突出完整闭环项目（调研→设计→验证）。', status:'applied', createdAt:Date.now()-86400000 }
];

var curFilter = 'all';
var curSearch = '';
var editingId = null;
var selStatus = 'watching';
var delId = null;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); }, 2200); }

/* ── 初始化 ── */
function init(){
    var list = getJobs();
    if(list.length===0){ saveJobs(SEED.slice()); }
    renderList();
}
function setFilter(btn){
    document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    curFilter = btn.dataset.st;
    renderList();
}
function renderList(){
    var kw = (document.getElementById('searchInput').value||'').trim().toLowerCase();
    var list = getJobs();
    var html = '';
    var shown = 0;
    list.forEach(function(j){
        if(curFilter!=='all' && j.status!==curFilter) return;
        if(kw && (j.company+' '+j.title+' '+(j.location||'')+' '+(j.note||'')).toLowerCase().indexOf(kw)<0) return;
        shown++;
        var st = STATUS_META[j.status] || STATUS_META.watching;
        var letter = esc((j.company||'?').charAt(0).toUpperCase());
        html += '<div class="job-card'+(j.showNote?' show-note':'')+'" data-id="'+j.id+'">'+
            '<div class="job-card-top">'+
                '<div class="job-logo">'+letter+'</div>'+
                '<div class="job-main">'+
                    '<div class="job-title-row"><span class="job-title">'+esc(j.title)+'</span><span class="status-badge '+st.cls+'">'+st.label+'</span></div>'+
                    '<div class="job-company">'+esc(j.company)+'</div>'+
                    '<div class="job-meta">'+
                        (j.location?'<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>'+esc(j.location)+'</span>':'')+
                        '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+fmtTime(j.createdAt)+' 收藏</span>'+
                    '</div>'+
                    (j.note?'<div class="job-note">'+esc(j.note)+'</div>':'')+
                '</div>'+
            '</div>'+
            '<div class="job-card-actions">'+
                (j.link?'<button class="job-act link" onclick="openLink(\''+j.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>打开链接</button>':'')+
                (j.note?'<button class="job-act edit" onclick="toggleNote(\''+j.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>备注</button>':'')+
                '<button class="job-act edit" onclick="openEdit(\''+j.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>编辑</button>'+
                '<button class="job-act del" onclick="openDel(\''+j.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>'+
            '</div>'+
        '</div>';
    });
    if(shown===0){
        html = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg><p>'+(curFilter!=='all'||kw?'没有符合条件的岗位':'收藏夹还是空的，点击「添加岗位」收藏第一个机会')+'</p></div>';
    }
    document.getElementById('jobList').innerHTML = html;
    document.getElementById('navCount').textContent = getJobs().length + ' 个岗位';
}
function fmtTime(ts){
    if(!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var days = Math.floor((now - d)/86400000);
    if(days<=0) return '今天';
    if(days===1) return '昨天';
    if(days<30) return days+' 天前';
    return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function openLink(id){
    var j = getJobs().find(function(x){ return x.id===id; });
    if(j && j.link){ window.open(j.link, '_blank'); }
}
function toggleNote(id){
    var card = document.querySelector('.job-card[data-id="'+id+'"]');
    if(card) card.classList.toggle('show-note');
}

/* ── 添加 / 编辑 ── */
function openAdd(){
    editingId = null;
    document.getElementById('modalTitle').textContent = '添加岗位';
    document.getElementById('fCompany').value = '';
    document.getElementById('fTitle').value = '';
    document.getElementById('fLocation').value = '';
    document.getElementById('fLink').value = '';
    document.getElementById('fNote').value = '';
    selStatus = 'watching';
    syncStatusChips();
    document.getElementById('modal').classList.add('show');
    setTimeout(function(){ document.getElementById('fCompany').focus(); }, 150);
}
function openEdit(id){
    var list = getJobs();
    var j = list.find(function(x){ return x.id===id; });
    if(!j) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = '编辑岗位';
    document.getElementById('fCompany').value = j.company||'';
    document.getElementById('fTitle').value = j.title||'';
    document.getElementById('fLocation').value = j.location||'';
    document.getElementById('fLink').value = j.link||'';
    document.getElementById('fNote').value = j.note||'';
    selStatus = j.status||'watching';
    syncStatusChips();
    document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function selectStatus(btn){
    document.querySelectorAll('#statusChips .status-chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    selStatus = btn.dataset.st;
}
function syncStatusChips(){
    document.querySelectorAll('#statusChips .status-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.st===selStatus); });
}
function saveJob(){
    var company = document.getElementById('fCompany').value.trim();
    var title = document.getElementById('fTitle').value.trim();
    if(!company){ showToast('请输入公司名称'); return; }
    if(!title){ showToast('请输入岗位名称'); return; }
    var location = document.getElementById('fLocation').value.trim();
    var link = document.getElementById('fLink').value.trim();
    var note = document.getElementById('fNote').value.trim();
    var list = getJobs();
    if(editingId){
        var j = list.find(function(x){ return x.id===editingId; });
        if(j){
            j.company = company; j.title = title; j.location = location; j.link = link; j.note = note; j.status = selStatus;
        }
        saveJobs(list);
        showToast('✅ 已更新');
    } else {
        list.unshift({ id:'job-'+Date.now(), company:company, title:title, location:location, link:link, note:note, status:selStatus, createdAt:Date.now() });
        saveJobs(list);
        showToast('✅ 已收藏');
    }
    closeModal();
    renderList();
}

/* ── 删除 ── */
function openDel(id){
    var list = getJobs();
    var j = list.find(function(x){ return x.id===id; });
    if(!j) return;
    delId = id;
    document.getElementById('delJobText').textContent = '确定删除「'+esc(j.company)+' · '+esc(j.title)+'」吗？';
    document.getElementById('delModal').classList.add('show');
}
function closeDelModal(){ document.getElementById('delModal').classList.remove('show'); }
function confirmDel(){
    var list = getJobs().filter(function(x){ return x.id!==delId; });
    saveJobs(list);
    delId = null;
    closeDelModal();
    showToast('已删除');
    renderList();
}

init();
</script>
</body>
</html>

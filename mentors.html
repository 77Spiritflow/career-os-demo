<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1v1 导师 · Career OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --primary: #0F766E; --primary-hover: #0D6B63; --primary-light: #14B8A6;
    --primary-50: #F0FDFA; --primary-100: #CCFBF1;
    --accent: #F59E0B; --accent-light: #FEF3C7; --accent-deep: #B45309;
    --green: #059669; --green-light: #D1FAE5;
    --rose: #F43F5E;
    --white: #FFFFFF;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0; --gray-300: #CBD5E1;
    --gray-400: #94A3B8; --gray-500: #64748B; --gray-600: #475569; --gray-900: #0F172A;
    --radius-lg: 22px; --radius-md: 16px; --radius-sm: 12px;
    --shadow-sm: 0 1px 3px rgba(15,23,42,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:430px;width:100%;min-height:100vh;background:var(--gray-50);margin:0 auto;position:relative;padding-bottom:36px}
.top-nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);height:56px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid rgba(226,232,240,.5)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;padding:4px 0}
.nav-back:active{color:var(--gray-900)}
.nav-back svg{width:18px;height:18px}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--gray-900)}
.nav-count{position:absolute;right:20px;font-size:11px;font-weight:600;color:var(--gray-400)}
.page{padding:16px 20px 0}

/* ── 顶部说明 ── */
.intro{padding:2px 2px 14px}
.intro h1{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
.intro p{font-size:11.5px;color:var(--gray-500);line-height:1.75;margin-top:7px}
.intro .price-note{font-size:10.5px;color:var(--gray-400);line-height:1.7;margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-200)}

/* ── 筛选 ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 20px 12px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 13px;border-radius:100px;border:1px solid var(--gray-200);background:#fff;color:var(--gray-500);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .18s}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

/* ── 导师卡 ── */
.mcard{background:#fff;border:1px solid var(--gray-100);border-radius:var(--radius-md);padding:15px 17px;margin-bottom:11px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s}
.mcard:active{transform:scale(.99)}
.mhead{display:flex;gap:11px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.mmain{flex:1;min-width:0}
.mname{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.mname b{font-size:14px;font-weight:700;color:var(--gray-900)}
.mname span{font-size:10.5px;color:var(--gray-400)}
.morg{font-size:11.5px;color:var(--gray-600);margin-top:3px;font-weight:500}
.morg em{font-style:normal;color:var(--gray-400);font-weight:400}
.mintro{font-size:11px;color:var(--gray-500);line-height:1.6;margin-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.mtags{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;margin-top:10px}
.mtag{display:flex;gap:5px;font-size:10.5px;color:var(--gray-500);line-height:1.5;min-width:0}
.mtag i{font-style:normal;flex-shrink:0;font-size:9.5px;font-weight:700;color:var(--primary);background:var(--primary-50);border-radius:4px;padding:1px 4px;height:16px;line-height:14px}
.mtag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid var(--gray-100)}
.mprice{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mprice b{font-size:16px;font-weight:800;color:var(--gray-900);letter-spacing:-.02em}
.mprice em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-light);padding:2px 7px;border-radius:5px}
.mbtn{flex-shrink:0;padding:8px 16px;border-radius:10px;border:none;background:var(--gray-900);color:#fff;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.mbtn:active{transform:scale(.97)}

/* ── 预约列表 ── */
.sec{margin-top:24px}
.sec-head{font-size:13.5px;font-weight:800;color:var(--gray-900)}
.sec-sub{font-size:11.5px;color:var(--gray-400);line-height:1.7;margin-top:5px;margin-bottom:10px}
.book{background:#fff;border:1px solid var(--gray-100);border-radius:var(--radius-md);padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.book-l b{font-size:12.5px;font-weight:700;display:block}
.book-l span{font-size:11px;color:var(--gray-500);display:block;margin-top:3px}
.book-l i{font-style:normal;font-size:10px;color:var(--primary);background:var(--primary-50);padding:2px 6px;border-radius:4px;margin-left:6px}
.book-r{text-align:right;flex-shrink:0}
.book-r b{font-size:13px;font-weight:700;display:block}
.book-r button{margin-top:5px;font-size:10.5px;color:var(--gray-400);background:none;border:none;font-family:inherit;cursor:pointer;padding:2px 0}
.empty{font-size:11.5px;color:var(--gray-400);background:#fff;border:1px dashed var(--gray-200);border-radius:var(--radius-md);padding:18px;text-align:center;line-height:1.7}

.foot{font-size:10.5px;color:var(--gray-400);line-height:1.8;text-align:center;padding:24px 12px 8px}

/* ── 详情弹层 ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.sheet-overlay.show{display:flex;opacity:1}
.sheet-box{width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-height:88vh;animation:slideUp .35s cubic-bezier(.22,1,.36,1) both}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head-left{display:flex;align-items:center;gap:13px;min-width:0}
.dt-avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;box-shadow:0 0 0 3px var(--gray-100)}
.sheet-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px;gap:12px}
.sheet-title{font-size:16px;font-weight:700;color:var(--gray-900)}
.sheet-sub{font-size:11.5px;color:var(--gray-500);margin-top:4px;line-height:1.6}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--gray-100);color:var(--gray-500);border:none;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;flex-shrink:0}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:0 22px 8px}
.sheet-footer{flex-shrink:0;padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--gray-100)}

.dblock{margin-top:16px}
.dlabel{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--gray-400);margin-bottom:8px}
.dtext{font-size:12px;color:var(--gray-600);line-height:1.8}
.dcap{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray-100)}
.dcap:last-child{border-bottom:none}
.dcap i{font-style:normal;flex-shrink:0;font-size:9.5px;font-weight:700;color:var(--primary);background:var(--primary-50);border-radius:4px;padding:2px 5px;height:17px;line-height:13px;margin-top:1px}
.dcap div b{display:block;font-size:11.5px;font-weight:600;color:var(--gray-900);line-height:1.5}
.dcap div span{display:block;font-size:10.5px;color:var(--gray-400);line-height:1.6;margin-top:2px}

.pbox{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:12px;padding:12px 13px;margin-top:4px}
.prow{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:var(--gray-500)}
.prow b{color:var(--gray-900);font-weight:600}
.prow.total{padding-top:8px;margin-top:5px;border-top:1px solid var(--gray-200);font-size:12px}
.prow.total b{font-size:15px;font-weight:800}
.pnote{font-size:10px;color:var(--gray-400);line-height:1.65;margin-top:8px;padding-top:8px;border-top:1px dashed var(--gray-200)}

.slots{display:flex;gap:7px;flex-wrap:wrap}
.slot{padding:7px 12px;border-radius:9px;border:1px solid var(--gray-200);background:#fff;font-size:11.5px;color:var(--gray-600);font-family:inherit;cursor:pointer}
.slot.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary);font-weight:600}
.slot.dis{opacity:.42;cursor:not-allowed;text-decoration:line-through}
.slot.vip{border-color:#FDE68A;background:var(--accent-light);color:var(--accent-deep)}
.slot.vip.on{border-color:var(--accent-deep);background:var(--accent-light);color:var(--accent-deep);font-weight:600}
.slot.vip.locked{background:var(--gray-50);border-color:var(--gray-200);color:var(--gray-400);cursor:pointer}
.slot-sep{width:100%;font-size:10px;font-weight:800;color:var(--accent-deep);letter-spacing:.03em;margin-top:5px;display:flex;align-items:center;gap:7px}
.slot-sep:after{content:'';flex:1;height:1px;background:var(--accent-light)}
.slot-note{width:100%;font-size:10.5px;color:var(--gray-400);margin-top:1px}
.slot-note a{color:var(--primary);font-weight:600;text-decoration:none}

/* ── 作品集评审 ── */
.rv-card{display:flex;align-items:center;gap:11px;background:var(--accent-light);border:1px solid #FDE68A;border-radius:14px;padding:12px 13px;margin-bottom:14px;cursor:pointer}
.rv-card.off{background:var(--gray-50);border-color:var(--gray-200)}
.rv-ico{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--accent-deep);flex-shrink:0;font-weight:700}
.rv-card.off .rv-ico{color:var(--gray-400)}
.rv-txt{flex:1;min-width:0}
.rv-txt b{display:block;font-size:12.5px;color:var(--gray-900);font-weight:700}
.rv-txt span{display:block;font-size:10.5px;color:var(--accent-deep);margin-top:2px;line-height:1.5}
.rv-card.off .rv-txt span{color:var(--gray-400)}
.rv-btn{flex-shrink:0;font-size:11px;font-weight:700;color:#fff;background:var(--accent-deep);border:none;border-radius:9px;padding:7px 11px;font-family:inherit;cursor:pointer}
.rv-card.off .rv-btn{background:var(--gray-900)}

.rv-step{font-size:11px;font-weight:700;color:var(--gray-900);margin:16px 0 9px;display:flex;align-items:center;gap:7px}
.rv-step:first-child{margin-top:2px}
.rv-step em{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--primary-50);color:var(--primary);font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.rv-mentors{display:flex;gap:8px;overflow-x:auto;margin:0 -22px;padding:0 22px 4px}
.rv-mentors::-webkit-scrollbar{display:none}
.rv-m{flex-shrink:0;width:76px;text-align:center;border:1.5px solid var(--gray-200);border-radius:12px;padding:9px 4px 8px;cursor:pointer;background:#fff}
.rv-m.on{border-color:var(--primary);background:var(--primary-50)}
.rv-mav{width:34px;height:34px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.rv-m b{display:block;font-size:11px;color:var(--gray-900);font-weight:700}
.rv-m span{display:block;font-size:9.5px;color:var(--gray-400);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-hint{font-size:10.5px;color:var(--gray-400);padding:2px 0}
.rv-input{width:100%;height:44px;border:1px solid var(--gray-200);border-radius:11px;padding:0 13px;font-size:12px;font-family:inherit;color:var(--gray-900);background:#fff;outline:none;box-sizing:border-box}
.rv-input:focus{border-color:var(--primary)}
.rv-tip{font-size:10px;color:var(--gray-400);line-height:1.65;margin-top:12px;padding:9px 11px;background:var(--gray-50);border-radius:9px}
.rv-done{background:var(--primary-50);border:1px solid #CCFBF1;border-radius:13px;padding:14px;margin-top:4px}
.rv-done-t{font-size:12.5px;font-weight:800;color:var(--primary);margin-bottom:10px}
.rv-done-row{display:flex;gap:10px;font-size:11px;padding:4px 0;line-height:1.55}
.rv-done-row span{color:var(--gray-400);flex-shrink:0;width:52px}
.rv-done-row b{color:var(--gray-900);font-weight:500;word-break:break-all}

.coupon{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-light);border-radius:10px;padding:9px 12px;margin-top:10px}
.coupon-l{font-size:11px;color:var(--accent-deep);font-weight:600;line-height:1.5}
.coupon-r{font-size:10.5px;color:var(--accent-deep);background:#fff;border:none;border-radius:6px;padding:4px 8px;font-family:inherit;cursor:pointer;font-weight:600;flex-shrink:0}
.coupon.warn{background:var(--gray-100)}
.coupon.warn .coupon-l{color:var(--gray-500);font-weight:400}

.tip-line{font-size:10.5px;color:var(--gray-400);line-height:1.7;margin-top:8px}
.tip-line a{color:var(--primary);text-decoration:none;font-weight:600;margin-left:3px;cursor:pointer}

.bigbtn{width:100%;height:48px;border-radius:14px;border:none;background:var(--gray-900);color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.bigbtn:active{transform:scale(.985)}
.bigbtn .sm{font-size:11px;font-weight:500;opacity:.7;margin-left:6px}
.foot-note{font-size:10px;color:var(--gray-400);text-align:center;margin-top:8px;line-height:1.6}

/* ── toast ── */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--gray-900);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    </style>
    <script>
(function(){try{var v=parseInt(localStorage.getItem('cos_fontsize'),10);if(isNaN(v)||v<0||v>2)v=1;var z=[0.92,1,1.12][v];document.documentElement.style.zoom=(z===1?'':String(z));}catch(e){}})();
    </script>
</head>
<body>
<div class="app">
    <nav class="top-nav">
        <button class="nav-back" onclick="goBack()" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span>返回</span>
        </button>
        <div class="nav-title">1v1 导师</div>
        <div class="nav-count" id="navCount">8 位</div>
    </nav>

    <div class="page">
        <div class="intro">
            <h1>找一位真正做过这行的人</h1>
            <p>不是泛泛的职业建议，是具体到岗位的面试、简历、作品集和内推渠道。</p>
            <p class="price-note">价格由平台统一制定，含导师课时费与平台服务费。会员折扣的差额由平台承担，导师收入不变。</p>
        </div>

        <div id="reviewEntry"></div>

        <div class="chips" id="chips"></div>
        <div id="mentorList"></div>

        <div class="sec">
            <div class="sec-head">我的预约</div>
            <div class="sec-sub">已约的时段会出现在这里，可随时取消。</div>
            <div id="bookingList"></div>
        </div>

        <div class="foot">导师背景与价格均为演示数据，不会真实扣款。<br>内推仅提供渠道与信息，不承诺录用结果。</div>
    </div>
</div>

<div class="sheet-overlay" id="detailSheet" onclick="if(event.target===this)closeDetail()">
    <div class="sheet-box">
        <div class="sheet-header">
            <div class="sheet-head-left">
                <div class="dt-avatar" id="dtAvatar">导</div>
                <div>
                    <div class="sheet-title" id="dtName">导师</div>
                    <div class="sheet-sub" id="dtOrg"></div>
                </div>
            </div>
            <button class="sheet-close" onclick="closeDetail()" aria-label="关闭">&times;</button>
        </div>
        <div class="sheet-body" id="dtBody"></div>
        <div class="sheet-footer" id="dtFooter"></div>
    </div>
</div>

<div class="sheet-overlay" id="reviewSheet" onclick="if(event.target===this)closeReview()">
    <div class="sheet-box">
        <div class="sheet-header">
            <div class="sheet-title">作品集评审</div>
            <button class="sheet-close" onclick="closeReview()" aria-label="关闭">&times;</button>
        </div>
        <div class="sheet-body" id="reviewBody"></div>
        <div class="sheet-footer" id="reviewFooter"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   1v1 导师
   - 导师列表（分类筛选）
   - 详情：四类能力 + 价格构成 + 时段
   - 预约：会员用券 / 原价
   - 会员券从 cos_membership 扣减
   数据：cos_mentor_bookings
   ══════════════════════════════════════════ */

];

    sim: '产品经理终面（case + 连环追问）',
    resume: '产品简历与项目复盘，把「我参与了」改成「我推动了」',
    refer: '字节产品岗内推渠道（可查在招 HC）',
    project: '用抖音电商真实业务做一次需求拆解练习',
    slots: ['周三 20:00', '周六 10:00', '周日 15:00'],
    vip: ['周一 19:00', '周五 20:00']
  },
  {
    id: 'm02', name: '林嘉', color: '#6366F1', cat: 'ux',
    company: '腾讯', role: '交互设计师', years: 5,
    rating: 4.9, sessions: 96, price: 299,
    intro: 'CDC 出身，做过社交与工具类产品。最擅长把作品集里讲不清的项目问清楚。',
    sim: '交互设计岗面试（作品集讲解答辩）',
    resume: 'UX 作品集结构与叙事顺序，砍掉凑数的项目',
    refer: '腾讯设计岗内推渠道',
    project: '拿一个真实需求，从竞品到交互稿走完一遍',
    slots: ['周二 19:30', '周四 21:00', '周六 14:00'],
    vip: ['周一 20:30', '周日 16:00']
  },
  {

/* ── 存储 ── */
function getJSON(key, def){
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e){ return def; }
}
function setJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
function getMember(){ return getJSON('cos_membership', null); }
function saveMember(m){ setJSON('cos_membership', m); }
function memberActive(){
  var m = getMember();
  return !!(m && m.active && m.expiresAt && Date.now() < m.expiresAt);
}
function couponLeft(){
  var m = getMember();
  if (!m || !m.active || Date.now() >= m.expiresAt) return 0;
  return Math.max(0, (m.couponsTotal || 0) - (m.couponsUsed || 0));
}
function getBookings(){ return getJSON('cos_mentor_bookings', []); }
function saveBookings(list){ setJSON('cos_mentor_bookings', list); }
function getReview(){ return getJSON('cos_portfolio_review', null); }
function saveReview(r){ setJSON('cos_portfolio_review', r); }
function reviewLeft(){
  var m = getMember();
  if (!m || !m.active || !m.expiresAt || Date.now() >= m.expiresAt) return -1;
  return Math.max(0, (m.reviewTotal || 0) - (m.reviewUsed || 0));
}
function fmtAt(t){
  var d = new Date(t); function p(n){ return n < 10 ? '0' + n : n; }
  return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function escH(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function memberPrice(p){
  var cut = Math.round(p * 0.15);
  if (cut > 50) cut = 50;
  return p - cut;
}
function money(n){ return '¥' + n; }
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function goBack(){
  if (document.referrer && document.referrer.indexOf('index.html') > -1) { history.back(); }
  else { location.href = 'index.html?tab=prepare'; }
}

function renderSlots(){
  if (!currentMentor) return;
  var booked = getBookings();
  var isM = memberActive();
  function mk(s, isVip){
    var taken = booked.some(function(b){ return b.mentorId === currentMentor.id && b.slot === s && b.status === 'upcoming'; });
    var locked = isVip && !isM && !taken;
    var cls = 'slot' + (isVip ? ' vip' : '') + (taken ? ' dis' : '') + (locked ? ' locked' : '') + (currentSlot === s ? ' on' : '');
    var act = taken ? 'disabled' : (locked ? 'onclick="vipLocked()"' : 'onclick="pickSlot(\'' + s + '\')"');
    var tail = taken ? ' 已约' : (locked ? ' Pro' : '');
    return '<button class="' + cls + '" ' + act + '>' + (isVip && !taken ? '★ ' : '') + s + tail + '</button>';
  }
  var html = currentMentor.slots.map(function(s){ return mk(s, false); }).join('');
  var vip = currentMentor.vip || [];
  if (vip.length) {
    html += '<div class="slot-sep">会员专享 · 每周 2 个更早时段</div>';
    html += vip.map(function(s){ return mk(s, true); }).join('');
    if (!isM) html += '<div class="slot-note">开通 Pro 后可约这些时段 <a onclick="goMembership()">了解 Pro →</a></div>';
  }
  var el = document.getElementById('slotWrap');
  if (el) el.innerHTML = html;
}

function vipLocked(){
  showToast('会员专享时段 · 开通 Pro 后可约');
}
function goMembership(){
  location.href = 'membership.html';
}

function pickSlot(s){
  currentSlot = (currentSlot === s ? '' : s);
  renderSlots();
  renderFooter();
}

function renderCoupon(){
  var wrap = document.getElementById('couponWrap');
  if (!wrap || !currentMentor) return;
  var left = couponLeft();
  var active = memberActive();

  if (!active) {
    var save = currentMentor.price - memberPrice(currentMentor.price);
    wrap.innerHTML =
      '<div class="tip-line">会员价 ' + money(memberPrice(currentMentor.price)) + '，本次可省 ' + money(save) + '。' +
      '<a onclick="location.href=\'membership.html\'">了解会员</a></div>';
    return;
  }
  if (left <= 0) {
    wrap.innerHTML = '<div class="coupon warn"><div class="coupon-l">今年的 3 张会员券已用完，本次按原价预约</div></div>';
    return;
  }
  if (useCoupon) {
    wrap.innerHTML =
      '<div class="coupon">' +
        '<div class="coupon-l">已使用会员 85 折券 · 本次省 ' + money(currentMentor.price - memberPrice(currentMentor.price)) + '<br>剩余 ' + left + ' 张</div>' +
        '<button class="coupon-r" onclick="toggleCoupon()">不用券</button>' +
      '</div>';
  } else {
    wrap.innerHTML =
      '<div class="coupon warn">' +
        '<div class="coupon-l">本次按原价预约，券留到下次</div>' +
        '<button class="coupon-r" onclick="toggleCoupon()">用券</button>' +
      '</div>';
  }
}

function toggleCoupon(){
  useCoupon = !useCoupon;
  renderCoupon();
  renderFooter();
}

function finalPrice(){
  if (!currentMentor) return 0;
  if (memberActive() && useCoupon && couponLeft() > 0) return memberPrice(currentMentor.price);
  return currentMentor.price;
}

function renderFooter(){
  if (!currentMentor) return;
  var price = finalPrice();
  var isMemberPrice = price < currentMentor.price;
  document.getElementById('dtFooter').innerHTML =
    '<button class="bigbtn" onclick="bookNow()">' + (isMemberPrice ? '会员价预约 ' : '预约 ') + money(price) +
      '<span class="sm">' + (currentSlot ? '· ' + currentSlot : '· 请先选时段') + '</span>' +
    '</button>' +
    '<div class="foot-note">预约后可在本页取消；取消后会员券自动退回</div>';

  var totalEl = document.getElementById('dtTotal');

}

/* ── 预约 ── */
function bookNow(){
  if (!currentMentor) return;
  if (!currentSlot) { showToast('先选一个时段'); return; }

  var bookings = getBookings();
  var dup = bookings.some(function(b){ return b.mentorId === currentMentor.id && b.slot === currentSlot && b.status === 'upcoming'; });
  if (dup) { showToast('这个时段已经被约了'); renderSlots(); return; }

  var price = finalPrice();
  var usedCoupon = price < currentMentor.price;
  var now = Date.now();
  var id = 'bk-' + now;

  bookings.push({
    id: id, mentorId: currentMentor.id, mentorName: currentMentor.name,
    company: currentMentor.company, role: currentMentor.role,
    slot: currentSlot, price: price, payType: usedCoupon ? 'member' : 'full',
    status: 'upcoming', createdAt: now
  });
  saveBookings(bookings);

  if (usedCoupon) {
    var m = getMember();
    if (m) {
      m.couponsUsed = (m.couponsUsed || 0) + 1;
      m.couponRecords = m.couponRecords || [];
      m.couponRecords.push({ bookingId: id, mentorId: currentMentor.id, at: now });
      saveMember(m);
    }
  }

  var name = currentMentor.name;
  var slot = currentSlot;
  closeDetail();
  renderList();
  renderBookings();
  showToast('已预约 ' + name + ' · ' + slot);
}

function cancelBooking(id){
  var bookings = getBookings();
  var target = bookings.filter(function(b){ return b.id === id; })[0];
  if (!target) return;

  saveBookings(bookings.filter(function(b){ return b.id !== id; }));

  if (target.payType === 'member') {
    var m = getMember();
    if (m) {
      m.couponsUsed = Math.max(0, (m.couponsUsed || 0) - 1);
      m.couponRecords = (m.couponRecords || []).filter(function(r){ return r.bookingId !== id; });
      saveMember(m);
    }
  }

  renderList();
  renderBookings();
  showToast(target.payType === 'member' ? '已取消，会员券已退回' : '已取消预约');
}

    renderRvMentors();
    renderRvSlots();
    foot.innerHTML = '<button class="bigbtn" onclick="submitReview()">提交评审申请</button>';
  }
  document.getElementById('reviewSheet').classList.add('show');
  body.scrollTop = 0;
}

function renderRvMentors(){
  var el = document.getElementById('rvMentors');
  if (!el) return;
  el.innerHTML = MENTORS.map(function(m){
    return '<div class="rv-m' + (rvMentorId === m.id ? ' on' : '') + '" onclick="pickRvMentor(\'' + m.id + '\')">' +
      '<div class="rv-mav" style="background:' + m.color + '">' + m.name.charAt(0) + '</div>' +
      '<b>' + m.name + '</b><span>' + m.company + '</span></div>';
  }).join('');
}
function pickRvMentor(id){
  rvMentorId = (rvMentorId === id ? '' : id);
  rvSlot = '';
  renderRvMentors();
  renderRvSlots();
}
function renderRvSlots(){
  var el = document.getElementById('rvSlots');
  if (!el) return;
  var m = MENTORS.filter(function(x){ return x.id === rvMentorId; })[0];
  if (!m) { el.innerHTML = '<div class="rv-hint">先选一位导师，再挑时段</div>'; return; }
  var booked = getBookings();
  var html = m.slots.map(function(s){
    var taken = booked.some(function(b){ return b.mentorId === m.id && b.slot === s && b.status === 'upcoming'; });
    return '<button class="slot' + (taken ? ' dis' : '') + (rvSlot === s ? ' on' : '') + '" ' + (taken ? 'disabled' : 'onclick="pickRvSlot(\'' + s + '\')"') + '>' + s + (taken ? ' 已约' : '') + '</button>';
  }).join('');
  html += (m.vip || []).map(function(s){
    return '<button class="slot vip' + (rvSlot === s ? ' on' : '') + '" onclick="pickRvSlot(\'' + s + '\')">★ ' + s + '</button>';
  }).join('');
  el.innerHTML = html;
}
function pickRvSlot(s){
  rvSlot = (rvSlot === s ? '' : s);
  renderRvSlots();
}
function submitReview(){
  if (!rvMentorId) { showToast('先选一位导师'); return; }
  if (!rvSlot) { showToast('先选一个时段'); return; }
  var inp = document.getElementById('rvLink');
  var link = ((inp && inp.value) || '').trim();
  if (!link) { showToast('填一下作品集链接'); return; }
  if (!/^(https?:\/\/|www\.)/i.test(link)) { showToast('链接要以 https:// 开头'); return; }
  if (reviewLeft() <= 0) { showToast('评审次数已用完'); return; }
  var m = MENTORS.filter(function(x){ return x.id === rvMentorId; })[0];
  var mem = getMember();
  mem.reviewUsed = (mem.reviewUsed || 0) + 1;
  saveMember(mem);
  saveReview({ mentorId: m.id, mentorName: m.name, company: m.company, slot: rvSlot, link: link, at: Date.now(), status: 'pending' });
  showToast('已提交 · 导师 48 小时内给反馈');
  closeReview();
  renderReviewEntry();
}
function closeReview(){
  document.getElementById('reviewSheet').classList.remove('show');
}

/* ── INIT ── */
renderChips();
renderList();
renderBookings();
renderReviewEntry();

/* 深链：职业档案「去约」→ 直接打开对应导师详情 */
(function(){
  var m = location.search.match(/[?&]mentor=([^&]+)/);
  if (!m) return;
  var id = decodeURIComponent(m[1]);
  if (MENTORS.some(function(x){ return x.id === id; })) openDetail(id);
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>求职管理 · Career OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --primary: #0F766E; --primary-hover: #0D6B63; --primary-light: #14B8A6;
    --primary-50: #F0FDFA; --primary-100: #CCFBF1;
    --indigo: #4F46E5; --indigo-light: #EEF2FF;
    --accent: #F59E0B; --accent-light: #FEF3C7;
    --sky: #0284C7; --sky-light: #E0F2FE;
    --violet: #7C3AED; --violet-light: #EDE9FE;
    --rose: #E11D48; --rose-light: #FFE4E6;
    --green: #059669; --green-light: #D1FAE5;
    --white: #FFFFFF;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0; --gray-300: #CBD5E1;
    --gray-400: #94A3B8; --gray-500: #64748B; --gray-600: #475569; --gray-900: #0F172A;
    --radius-lg: 16px; --radius-md: 12px; --radius-sm: 10px;
    --shadow-sm: 0 1px 3px rgba(15,23,42,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:430px;width:100%;min-height:100vh;background:var(--gray-50);margin:0 auto;position:relative;padding-bottom:40px}
.top-nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(226,232,240,.5)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;padding:4px 0}
.nav-back:active{color:var(--gray-900)}
.nav-back svg{width:18px;height:18px}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--gray-900)}
.nav-count{position:absolute;right:16px;font-size:12px;color:var(--gray-400);font-weight:500}
.page{padding:16px 16px 0}
.section{margin-bottom:18px}

/* ── 添加按钮 ── */
.add-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;border:none;border-radius:var(--radius-md);padding:13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.25);transition:all .2s;margin-bottom:14px}
.add-btn:active{transform:scale(.97)}
.add-btn svg{width:17px;height:17px}

/* ── 统计 ── */
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat-card{flex:1;background:#fff;border-radius:var(--radius-md);padding:12px;text-align:center;border:1px solid var(--gray-100);box-shadow:var(--shadow-sm)}
.stat-num{font-size:20px;font-weight:800;color:var(--primary)}
.stat-num.ok{color:var(--green)}
.stat-num.no{color:var(--rose)}
.stat-label{font-size:11px;color:var(--gray-400);margin-top:2px}

/* ── 筛选 ── */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 14px;font-size:12px;font-weight:500;color:var(--gray-500);background:#fff;border:1px solid var(--gray-200);border-radius:99px;cursor:pointer;transition:all .2s;font-family:inherit}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

/* ── 记录卡片 ── */
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec-card{background:#fff;border-radius:var(--radius-md);padding:14px;border:1px solid var(--gray-100);box-shadow:var(--shadow-sm);animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
.rec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-type{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec-type svg{width:14px;height:14px}
.rec-type.target{background:var(--sky-light);color:var(--sky)}
.rec-type.upcoming{background:var(--accent-light);color:#B45309}
.rec-type.done{background:var(--indigo-light);color:var(--indigo)}
.rec-title{font-size:14px;font-weight:700;color:var(--gray-900);flex:1;min-width:0}
.rec-company{font-size:12px;color:var(--gray-500);margin-top:4px}
.rec-badge{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600}
.rec-badge.target{background:var(--sky-light);color:var(--sky)}
.rec-badge.upcoming{background:var(--accent-light);color:#B45309}
.rec-badge.success{background:var(--green-light);color:var(--green)}
.rec-badge.fail{background:var(--rose-light);color:var(--rose)}
.rec-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;font-size:11.5px;color:var(--gray-400)}
.rec-meta span{display:flex;align-items:center;gap:3px}
.rec-meta svg{width:12px;height:12px}
.rec-extra{display:none;margin-top:10px;padding:10px 12px;background:var(--gray-50);border-radius:var(--radius-sm);font-size:12.5px;color:var(--gray-600);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.rec-card.show-extra .rec-extra{display:block}
.rec-extra .block{margin-bottom:10px}
.rec-extra .block:last-child{margin-bottom:0}
.rec-extra .block-label{font-size:11px;font-weight:700;color:var(--gray-900);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.rec-extra .block-label svg{width:12px;height:12px}
.rec-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100)}
.rec-act{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;padding:5px 8px;border-radius:8px;transition:all .2s}
.rec-act:active{background:var(--gray-100)}
.rec-act svg{width:14px;height:14px}
.rec-act.view{color:var(--primary)}
.rec-act.edit{color:var(--primary)}
.rec-act.del{color:var(--rose)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 20px;color:var(--gray-300)}
.empty svg{width:42px;height:42px}
.empty p{font-size:13px;color:var(--gray-400);text-align:center;line-height:1.7}

/* ── 弹窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:0 24px;opacity:0;transition:opacity .25s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:20px;max-height:86vh;overflow-y:auto;transform:scale(.92);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.modal-overlay.show .modal-box{transform:scale(1)}
.modal-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--gray-500);margin-bottom:6px}
.form-input{width:100%;padding:11px 13px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;background:var(--white);color:var(--gray-900);transition:border-color .2s;outline:none}
.form-input:focus{border-color:var(--primary)}
textarea.form-input{resize:none;min-height:80px;line-height:1.6}
.type-chips{display:flex;gap:6px;flex-wrap:wrap}
.type-chip{flex-shrink:0;padding:6px 12px;font-size:12px;font-weight:500;color:var(--gray-500);background:var(--gray-100);border:none;border-radius:99px;cursor:pointer;font-family:inherit;transition:all .2s}
.type-chip.active{background:var(--primary);color:#fff;font-weight:600}
.result-chips{display:flex;gap:6px}
.result-chip{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;font-size:13px;font-weight:600;color:var(--gray-500);background:var(--gray-100);border:none;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;transition:all .2s}
.result-chip svg{width:15px;height:15px}
.result-chip.success.active{background:var(--green-light);color:var(--green)}
.result-chip.fail.active{background:var(--rose-light);color:var(--rose)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;box-shadow:0 4px 16px rgba(15,118,110,.25)}
.btn-outline{background:#fff;color:var(--gray-500);border:1.5px solid var(--gray-200)}
.btn-danger{background:var(--rose-light);color:var(--rose)}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--gray-900);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:400;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:431px){body{background:#E2E8F0}.app{box-shadow:0 0 80px rgba(0,0,0,.08)}}
    </style>
<script>
/* 全局字体大小：设置页「小/中/大」三档全局生效 */
(function(){try{var v=parseInt(localStorage.getItem('cos_fontsize'),10);if(isNaN(v)||v<0||v>2)v=1;var z=[0.92,1,1.12][v];document.documentElement.style.zoom=(z===1?'':String(z));}catch(e){}})();
</script>
</head>
<body>
<div class="app">
    <nav class="top-nav">
        <button class="nav-back" onclick="window.location.href='index.html?tab=prepare'" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span>返回</span>
        </button>
        <span class="nav-title">求职管理</span>
        <span class="nav-count" id="navCount">0 条</span>
    </nav>

    <div class="page">
        <div class="section">
            <button class="add-btn" onclick="openAdd()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                <span>添加记录</span>
            </button>

            <div class="stat-row">
                <div class="stat-card"><div class="stat-num" id="statTarget">0</div><div class="stat-label">目标公司</div></div>
                <div class="stat-card"><div class="stat-num" id="statUpcoming">0</div><div class="stat-label">待面试</div></div>
                <div class="stat-card"><div class="stat-num ok" id="statSuccess">0</div><div class="stat-label">面试成功</div></div>
                <div class="stat-card"><div class="stat-num no" id="statFail">0</div><div class="stat-label">面试失败</div></div>
            </div>

            <div class="filter-row">
                <button class="filter-chip active" data-ft="all" onclick="setFilter(this)">全部</button>
                <button class="filter-chip" data-ft="target" onclick="setFilter(this)">目标公司</button>
                <button class="filter-chip" data-ft="upcoming" onclick="setFilter(this)">待面试</button>
                <button class="filter-chip" data-ft="done" onclick="setFilter(this)">已面试</button>
            </div>
            <div class="rec-list" id="recList"></div>
        </div>
    </div>
</div>

<!-- 添加/编辑弹窗 -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">添加记录</div>

        <div class="form-group">
            <label class="form-label">记录类型 *</label>
            <div class="type-chips" id="typeChips">
                <button type="button" class="type-chip active" data-tp="target" onclick="selectType(this)">目标公司</button>
                <button type="button" class="type-chip" data-tp="upcoming" onclick="selectType(this)">待面试</button>
                <button type="button" class="type-chip" data-tp="done" onclick="selectType(this)">已面试</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">公司名称 *</label>
            <input class="form-input" id="fCompany" placeholder="如：字节跳动" maxlength="40">
        </div>
        <div class="form-group">
            <label class="form-label">目标岗位 *</label>
            <input class="form-input" id="fTitle" placeholder="如：UX 设计师（实习）" maxlength="60">
        </div>

        <!-- 目标公司：JD -->
        <div class="form-group" id="gJd" style="display:none">
            <label class="form-label">岗位 JD</label>
            <textarea class="form-input" id="fJd" placeholder="粘贴岗位描述，方便面试前对照准备"></textarea>
        </div>

        <!-- 待面试：时间 + 注意事项 -->
        <div class="form-group" id="gTime" style="display:none">
            <label class="form-label">面试时间</label>
            <input class="form-input" id="fTime" placeholder="如：10/18 14:00 线上面试" maxlength="40">
        </div>
        <div class="form-group" id="gNotes" style="display:none">
            <label class="form-label">注意事项</label>
            <textarea class="form-input" id="fNotes" placeholder="面试前要准备什么、要注意什么…"></textarea>
        </div>

        <!-- 已面试：结果 + 复盘 + 改进方向 -->
        <div class="form-group" id="gResult" style="display:none">
            <label class="form-label">面试结果 *</label>
            <div class="result-chips" id="resultChips">
                <button type="button" class="result-chip success active" data-rs="success" onclick="selectResult(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>成功</button>
                <button type="button" class="result-chip fail" data-rs="fail" onclick="selectResult(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>失败</button>
            </div>
        </div>
        <div class="form-group" id="gReview" style="display:none">
            <label class="form-label">经验 / 复盘</label>
            <textarea class="form-input" id="fReview" placeholder="这次面试学到了什么、哪些问题没答好…"></textarea>
        </div>
        <div class="form-group" id="gImprove" style="display:none">
            <label class="form-label">接下来要调整和改进的方向</label>
            <textarea class="form-input" id="fImprove" placeholder="下次面试前要补齐什么、怎么改进…"></textarea>
        </div>

        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveRec()">保存</button>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="delModal">
    <div class="modal-box">
        <div class="modal-title">删除记录</div>
        <p style="font-size:13.5px;color:var(--gray-500);line-height:1.7" id="delRecText"></p>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeDelModal()">取消</button>
            <button class="btn btn-danger" onclick="confirmDel()">删除</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   job-management.js | Career OS — 求职管理
   数据存储：localStorage 'cos_job_manage'
   类型：target(目标公司) / upcoming(待面试) / done(已面试)
   ============================================================ */
var REC_KEY = 'cos_job_manage';
var TYPE_META = {
    target:   { label:'目标公司', cls:'target', badge:'target' },
    upcoming: { label:'待面试', cls:'upcoming', badge:'upcoming' },
    done:     { label:'已面试', cls:'done', badge:'done' }
};

function getRecs(){ try{ var v=JSON.parse(localStorage.getItem(REC_KEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function saveRecs(list){ try{ localStorage.setItem(REC_KEY, JSON.stringify(list)); }catch(e){ console.warn('[job-management] 写入失败', e); } }

/* 种子示例（首次打开预置，可编辑/删除） */
var SEED = [
    { id:'jm-1001', type:'target', company:'字节跳动', title:'产品体验设计师（实习）', jd:'1. 负责抖音系产品的体验设计与改版 2. 参与用户研究、输出方案并跟进落地 3. 熟悉 Figma、具备数据思维者优先', interviewTime:'', notes:'', result:'', review:'', improve:'', createdAt:Date.now()-86400000*3 },
    { id:'jm-1002', type:'upcoming', company:'腾讯', title:'UI/UX 设计实习生', jd:'', interviewTime:'10/18 14:00 线上面试', notes:'提前准备作品集讲解（重点讲 Career OS 的完整闭环）；确认面试官侧链路；调试好摄像头和麦克风', result:'', review:'', improve:'', createdAt:Date.now()-86400000 },
    { id:'jm-1003', type:'done', company:'某互联网公司', title:'产品实习生', jd:'', interviewTime:'', notes:'', result:'fail', review:'自我介绍太啰嗦，项目成果没有量化；对「如何衡量设计价值」回答不够结构化', improve:'准备 1 分钟/2 分钟两版自我介绍；把项目数据整理成 STAR 卡片；提前演练行为面试高频题', createdAt:Date.now()-3600000*5 }
];

var curFilter = 'all';
var editingId = null;
var selType = 'target';
var selResult = 'success';
var delId = null;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); }, 2200); }

function init(){
    var list = getRecs();
    if(list.length===0){ saveRecs(SEED.slice()); }
    renderList();
}
function setFilter(btn){
    document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    curFilter = btn.dataset.ft;
    renderList();
}
function renderList(){
    var list = getRecs();
    var statT=0, statU=0, statS=0, statF=0;
    list.forEach(function(r){
        if(r.type==='target') statT++;
        else if(r.type==='upcoming') statU++;
        else if(r.type==='done'){ if(r.result==='success') statS++; else statF++; }
    });
    document.getElementById('statTarget').textContent = statT;
    document.getElementById('statUpcoming').textContent = statU;
    document.getElementById('statSuccess').textContent = statS;
    document.getElementById('statFail').textContent = statF;
    document.getElementById('navCount').textContent = list.length + ' 条';

    var html = '';
    var shown = 0;
    list.forEach(function(r){
        if(curFilter!=='all' && r.type!==curFilter) return;
        shown++;
        var tm = TYPE_META[r.type] || TYPE_META.target;
        var badgeHtml = '';
        if(r.type==='target') badgeHtml = '<span class="rec-badge target">目标</span>';
        else if(r.type==='upcoming') badgeHtml = '<span class="rec-badge upcoming">待面试</span>';
        else badgeHtml = '<span class="rec-badge '+(r.result==='success'?'success':'fail')+'">'+(r.result==='success'?'✓ 成功':'✗ 失败')+'</span>';

        var extra = '';
        var blocks = [];
        if(r.jd) blocks.push({label:'岗位 JD', svg:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>', text:r.jd});
        if(r.notes) blocks.push({label:'注意事项', svg:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>', text:r.notes});
        if(r.review) blocks.push({label:'经验 / 复盘', svg:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>', text:r.review});
        if(r.improve) blocks.push({label:'接下来要改进的方向', svg:'<path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/>', text:r.improve});
        if(blocks.length){
            extra = '<div class="rec-extra">'+blocks.map(function(b){
                return '<div class="block"><div class="block-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+b.svg+'</svg>'+b.label+'</div><div>'+esc(b.text)+'</div></div>';
            }).join('')+'</div>';
        }

        var meta = '<span>'+tm.label+'</span>';
        if(r.type==='upcoming' && r.interviewTime) meta += '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+esc(r.interviewTime)+'</span>';

        html += '<div class="rec-card'+(r.showExtra?' show-extra':'')+'" data-id="'+r.id+'">'+
            '<div class="rec-head">'+
                '<div class="rec-type '+tm.cls+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>'+
                '<div class="rec-title">'+esc(r.title)+'</div>'+
                badgeHtml+
            '</div>'+
            '<div class="rec-company">'+esc(r.company)+'</div>'+
            '<div class="rec-meta">'+meta+'</div>'+
            extra+
            '<div class="rec-actions">'+
                (blocks.length?'<button class="rec-act view" onclick="toggleExtra(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>详情</button>':'')+
                '<button class="rec-act edit" onclick="openEdit(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>编辑</button>'+
                '<button class="rec-act del" onclick="openDel(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>'+
            '</div>'+
        '</div>';
    });
    if(shown===0){
        html = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><p>'+(curFilter!=='all'?'没有符合条件的记录':'还没有求职记录，点击「添加记录」开始管理你的求职旅程')+'</p></div>';
    }
    document.getElementById('recList').innerHTML = html;
}
function toggleExtra(id){
    var card = document.querySelector('.rec-card[data-id="'+id+'"]');
    if(card) card.classList.toggle('show-extra');
}

/* ── 弹窗字段联动 ── */
function syncFields(){
    document.getElementById('gJd').style.display = selType==='target' ? 'block':'none';
    document.getElementById('gTime').style.display = selType==='upcoming' ? 'block':'none';
    document.getElementById('gNotes').style.display = selType==='upcoming' ? 'block':'none';
    document.getElementById('gResult').style.display = selType==='done' ? 'block':'none';
    document.getElementById('gReview').style.display = selType==='done' ? 'block':'none';
    document.getElementById('gImprove').style.display = (selType==='done' && selResult==='fail') ? 'block':'none';
}
function selectType(btn){
    document.querySelectorAll('#typeChips .type-chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    selType = btn.dataset.tp;
    syncFields();
}
function selectResult(btn){
    document.querySelectorAll('#resultChips .result-chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    selResult = btn.dataset.rs;
    syncFields();
}

/* ── 添加 / 编辑 ── */
function openAdd(){
    editingId = null;
    document.getElementById('modalTitle').textContent = '添加记录';
    selType = 'target'; selResult = 'success';
    document.querySelectorAll('#typeChips .type-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.tp==='target'); });
    document.querySelectorAll('#resultChips .result-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.rs==='success'); });
    document.getElementById('fCompany').value = '';
    document.getElementById('fTitle').value = '';
    document.getElementById('fJd').value = '';
    document.getElementById('fTime').value = '';
    document.getElementById('fNotes').value = '';
    document.getElementById('fReview').value = '';
    document.getElementById('fImprove').value = '';
    syncFields();
    document.getElementById('modal').classList.add('show');
    setTimeout(function(){ document.getElementById('fCompany').focus(); }, 150);
}
function openEdit(id){
    var list = getRecs();
    var r = list.find(function(x){ return x.id===id; });
    if(!r) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = '编辑记录';
    selType = r.type || 'target';
    selResult = (r.type==='done' && r.result) ? r.result : 'success';
    document.querySelectorAll('#typeChips .type-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.tp===selType); });
    document.querySelectorAll('#resultChips .result-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.rs===selResult); });
    document.getElementById('fCompany').value = r.company||'';
    document.getElementById('fTitle').value = r.title||'';
    document.getElementById('fJd').value = r.jd||'';
    document.getElementById('fTime').value = r.interviewTime||'';
    document.getElementById('fNotes').value = r.notes||'';
    document.getElementById('fReview').value = r.review||'';
    document.getElementById('fImprove').value = r.improve||'';
    syncFields();
    document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function saveRec(){
    var company = document.getElementById('fCompany').value.trim();
    var title = document.getElementById('fTitle').value.trim();
    if(!company){ showToast('请输入公司名称'); return; }
    if(!title){ showToast('请输入目标岗位'); return; }
    var data = {
        company: company, title: title,
        jd: document.getElementById('fJd').value.trim(),
        interviewTime: document.getElementById('fTime').value.trim(),
        notes: document.getElementById('fNotes').value.trim(),
        result: selType==='done' ? selResult : '',
        review: document.getElementById('fReview').value.trim(),
        improve: document.getElementById('fImprove').value.trim()
    };
    var list = getRecs();
    if(editingId){
        var r = list.find(function(x){ return x.id===editingId; });
        if(r){ r.type=selType; Object.assign(r, data); }
        saveRecs(list);
        showToast('✅ 已更新');
    } else {
        data.id = 'jm-'+Date.now();
        data.type = selType;
        data.createdAt = Date.now();
        list.unshift(data);
        saveRecs(list);
        showToast('✅ 已添加');
    }
    closeModal();
    renderList();
}

/* ── 删除 ── */
function openDel(id){
    var list = getRecs();
    var r = list.find(function(x){ return x.id===id; });
    if(!r) return;
    delId = id;
    document.getElementById('delRecText').textContent = '确定删除「'+esc(r.company)+' · '+esc(r.title)+'」吗？';
    document.getElementById('delModal').classList.add('show');
}
function closeDelModal(){ document.getElementById('delModal').classList.remove('show'); }
function confirmDel(){
    var list = getRecs().filter(function(x){ return x.id!==delId; });
    saveRecs(list);
    delId = null;
    closeDelModal();
    showToast('已删除');
    renderList();
}

init();
</script>
</body>
</html>

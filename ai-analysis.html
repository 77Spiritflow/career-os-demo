/* ============================================================
   global.css | Career OS — 全局公共样式
   所有页面共用，页面独有样式写在各自style内
   ============================================================ */

/* ── CSS 变量（全量超集） ── */
:root {
    --primary: #0F766E; --primary-hover: #0D6B63; --primary-light: #14B8A6;
    --primary-50: #F0FDFA; --primary-100: #CCFBF1; --primary-200: #99F6E4;
    --white: #FFFFFF;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
    --gray-300: #CBD5E1; --gray-400: #94A3B8; --gray-500: #64748B;
    --gray-600: #475569; --gray-900: #0F172A;
    --accent: #F59E0B; --accent-light: #FEF3C7;
    --indigo: #6366F1; --indigo-light: #EEF2FF;
    --rose: #F43F5E; --rose-light: #FFF1F2;
    --violet: #8B5CF6; --violet-light: #F5F3FF;
    --sky: #0EA5E9; --sky-light: #E0F2FE;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.02);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
    --radius-sm: 12px; --radius-md: 16px; --radius-lg: 22px; --radius-xl: 28px;
    --nav-h: 56px; --tab-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
}

/* ── Reset ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── Body ── */
body{font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ── App 容器 ── */
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--gray-50);position:relative}

/* ── 顶部导航栏（基础） ── */
.top-nav{position:sticky;top:0;z-index:100;background:rgba(248,250,252,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px}

/* ── 品牌标识（首页 / 设置页） ── */
.nav-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;color:var(--gray-900);letter-spacing:-0.03em}
.nav-brand-icon{width:30px;height:30px;background:linear-gradient(145deg,var(--primary),var(--primary-light));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}

/* ── AI 按钮（首页 / 设置页） ── */
.nav-ai-btn{display:flex;align-items:center;gap:5px;padding:7px 13px 7px 10px;background:var(--gray-900);color:#fff;border:none;border-radius:100px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;position:relative;overflow:hidden;transition:all .2s}
.nav-ai-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-100%);animation:shimmer 3s ease-in-out infinite}
.nav-ai-btn:active{transform:scale(.95)}
.nav-ai-btn svg{width:14px;height:14px;flex-shrink:0}

/* ── 返回按钮（测评 / AI分析页） ── */
.nav-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--gray-500);background:none;border:none;font-family:inherit;cursor:pointer;transition:color .2s;padding:4px 0}
.nav-back:active{color:var(--gray-900)}
.nav-back svg{width:18px;height:18px}

/* ── 居中标题（测评 / AI分析页） ── */
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--gray-900);letter-spacing:-.01em}

/* ── 步骤文字 ── */
.nav-step{font-size:12px;color:var(--gray-400);font-weight:500}

/* ── Screen 容器（测评 / AI分析页） ── */
.screen{display:none;padding:20px;padding-bottom:80px;flex-direction:column}
.screen.active{display:flex;animation:screenIn .4s cubic-bezier(.22,1,.36,1) both}

/* ── 主按钮 ── */
.btn-primary{width:100%;padding:13px 24px;background:linear-gradient(145deg,var(--primary),var(--primary-hover));color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(15,118,110,.25);transition:all .2s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{background:var(--gray-300);box-shadow:none;cursor:default}

/* ── 描边按钮 ── */
.btn-outline{width:100%;padding:13px 24px;background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:var(--radius-md);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-outline:active{background:var(--primary-50);transform:scale(.98)}

/* ── 底部操作栏 ── */
.bottom-bar{position:sticky;bottom:0;padding:12px 20px;padding-bottom:calc(12px + var(--safe-b));background:rgba(248,250,252,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(226,232,240,.4);display:flex;gap:10px;align-items:center;z-index:50}

/* ── 确认弹窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:0 24px;opacity:0;transition:opacity .25s}
.modal-overlay.show{opacity:1}
.modal-box{background:#fff;border-radius:var(--radius-lg);padding:24px;max-width:320px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.15);transform:scale(.92);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.modal-overlay.show .modal-box{transform:scale(1)}
.modal-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:8px}
.modal-desc{font-size:13px;color:var(--gray-500);line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:10px}
.modal-cancel{flex:1;padding:11px;background:var(--gray-100);color:var(--gray-600);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s}
.modal-cancel:active{background:var(--gray-200)}
.modal-confirm{flex:1;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.modal-confirm:active{background:var(--primary-hover)}

/* ── Toast 通知 ── */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--gray-900);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Keyframes ── */
@keyframes shimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes screenIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes softPop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}
@keyframes dotBounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ── 响应式：桌面端 ── */
@media(min-width:431px){body{background:#E2E8F0}.app{box-shadow:0 0 80px rgba(0,0,0,.08)}}

/* ── 无障碍：减少动画 ── */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
    <script>
/* ============================================================
   store.js | Career OS — 全局数据存储
   所有跨页面共享数据统一存放于此，使用 localStorage 持久化
   ============================================================ */

var Store = (function () {
    var STORAGE_KEY = 'career_os_store';

    // 默认数据结构
    var _defaults = {
        user: null,           // 用户账号信息 { id, name, email, ... }
        assessment: null,     // 测评结果 { answers, scores, code, codeNames, profile, recommendedCareers }
        careerGoal: null,     // 用户选定的职业目标数组 [{ name, dim, ... }]
        timeline: null,       // 中长期目标
        dailyTasks: null,     // 拆解后的每日任务数组
        portfolio: null       // 用户上传的成果沉淀列表
    };

    // 当前内存数据
    var _data = {};

    // 从 localStorage 读取
    function _load() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                _data = JSON.parse(raw);
            } else {
                _data = _deepClone(_defaults);
            }
        } catch (e) {
            _data = _deepClone(_defaults);
        }
        // 确保每个字段都有默认值
        for (var key in _defaults) {
            if (_data[key] === undefined) {
                _data[key] = _defaults[key];
            }
        }
    }

    // 保存到 localStorage
    function _save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(_data));
        } catch (e) {
            console.warn('[Store] localStorage 写入失败', e);
        }
    }

    // 深拷贝
    function _deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
    }

    // 初始化
    _load();

    return {
        /**
         * 获取指定字段值
         * @param {string} key - 字段名
         * @returns {*} 字段值
         */
        get: function (key) {
            if (key) return _data[key];
            return _deepClone(_data);
        },

        /**
         * 设置指定字段值并持久化
         * @param {string} key - 字段名
         * @param {*} value - 字段值
         */
        set: function (key, value) {
            _data[key] = value;
            _save();
        },

        /**
         * 批量更新多个字段
         * @param {Object} updates - { key1: value1, key2: value2, ... }
         */
        batch: function (updates) {
            for (var key in updates) {
                if (updates.hasOwnProperty(key)) {
                    _data[key] = updates[key];
                }
            }
            _save();
        },

        /**
         * 清空所有数据，恢复默认值
         */
        clear: function () {
            _data = _deepClone(_defaults);
            _save();
        },

        /**
         * 删除指定字段
         * @param {string} key
         */
        remove: function (key) {
            _data[key] = _defaults[key] !== undefined ? _defaults[key] : null;
            _save();
        },

        /**
         * 检查用户是否已完成测评
         * @returns {boolean}
         */
        hasAssessment: function () {
            return !!(_data.assessment && _data.assessment.code);
        },

        /**
         * 检查用户是否已选定职业目标
         * @returns {boolean}
         */
        hasCareerGoal: function () {
            return !!(_data.careerGoal && _data.careerGoal.length > 0);
        }
    };
})();

</script>
    <script>
/* ============================================================
   router.js | Career OS — 页面跳转辅助函数
   所有页面跳转优先使用此模块，统一管理路由
   ============================================================ */

var Router = (function () {
    // 基础路径（同目录下的页面）
    var BASE = '';

    return {
        /**
         * 跳转到指定页面
         * @param {string} page - 页面文件名，如 'index.html'
         */
        go: function (page) {
            window.location.href = BASE + page;
        },

        /** 跳转到首页 */
        toIndex: function () {
            this.go('index.html');
        },

        /** 跳转到职业测评页 */
        toAssessment: function () {
            this.go('assessment.html');
        },

        /** 跳转到AI深度分析页 */
        toAiAnalysis: function () {
            this.go('ai-analysis.html');
        },

        /** 跳转到AI对话页 */
        toAiChat: function () {
            this.go('ai-chat.html');
        },

        /** 跳转到设置页 */
        toSettings: function () {
            this.go('settings.html');
        },

        /** 跳转到登录页 */
        toLogin: function () {
            this.go('login.html');
        },

        /** 跳转到职业图景页 */
        toCareerVision: function () {
            this.go('career-vision.html');
        },

        /** 浏览器后退 */
        back: function () {
            window.history.back();
        },

        /**
         * 获取当前页面名称
         * @returns {string} 如 'index', 'assessment', 'ai-analysis' 等
         */
        currentPage: function () {
            var path = window.location.pathname;
            var file = path.substring(path.lastIndexOf('/') + 1);
            return file.replace('.html', '');
        }
    };
})();

</script>
    <script>
/* ============================================================
   auth.js | Career OS — 认证模块
   阶段1：纯前端模拟，不接 Supabase
   阶段2：接入 Supabase 真实认证
   ============================================================ */

var Auth = (function () {
    return {
        /**
         * 检查用户是否已登录
         * @returns {boolean}
         */
        isLoggedIn: function () {
            return !!(Store && Store.get('user'));
        },

        /**
         * 获取当前登录用户信息
         * @returns {Object|null}
         */
        getUser: function () {
            return Store ? Store.get('user') : null;
        },

        /**
         * 模拟登录（阶段1）
         * @param {Object} userData - 用户数据 { id, name, email }
         */
        login: function (userData) {
            if (Store) {
                Store.set('user', userData);
            }
        },

        /**
         * 退出登录
         */
        logout: function () {
            if (Store) {
                Store.set('user', null);
            }
        },

        /**
         * 需要登录时调用，未登录则跳转登录页
         * @returns {boolean} 是否已登录
         */
        requireLogin: function () {
            if (!this.isLoggedIn()) {
                if (typeof Router !== 'undefined') {
                    Router.toLogin();
                }
                return false;
            }
            return true;
        }
    };
})();

</script>

<script>
/* ===== 全局状态 ===== */
/* 从 store 读取测评结果 */
var riasecCode = 'RIA'; /* 默认值 */
if(typeof Store!=='undefined' && Store.hasAssessment()){
  riasecCode = Store.get('assessment').code || 'RIA';
}
var userProfile = {};
var aiReport = null;
var selectedGoals = [];
var toastTimer;
var modalCallback = null;

/* ===== 通用工具 ===== */
function showToast(m){var t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=m;t.classList.add('show');toastTimer=setTimeout(function(){t.classList.remove('show');},2200);}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}

/* ===== 弹窗 ===== */
function showModal(title,desc,onConfirm){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-desc').textContent=desc;
  modalCallback=onConfirm;
  var o=document.getElementById('modal-overlay');o.style.display='flex';
  requestAnimationFrame(function(){o.classList.add('show');});
}
function closeModal(){
  var o=document.getElementById('modal-overlay');o.classList.remove('show');
  setTimeout(function(){o.style.display='none';},250);
}
function confirmModal(){if(modalCallback)modalCallback();closeModal();}

/* ===== 表单逻辑 ===== */
function openFormSheet(){
  var o=document.getElementById('form-overlay');
  o.style.display='flex';
  requestAnimationFrame(function(){o.classList.add('show');});
}
function closeFormSheet(e){
  if(e&&e.target!==document.getElementById('form-overlay'))return;
  var o=document.getElementById('form-overlay');o.classList.remove('show');
  setTimeout(function(){o.style.display='none';},300);
}

function pickRadio(el,groupId){
  document.querySelectorAll('#'+groupId+' .form-radio').forEach(function(r){r.classList.remove('sel');});
  el.classList.add('sel');
  checkFormValid();
}
function toggleChip(el){
  el.classList.toggle('sel');
  checkFormValid();
}

function checkFormValid(){
  var school=document.getElementById('f-school').value.trim();
  var major=document.getElementById('f-major').value.trim();
  var grade=document.getElementById('f-grade').value;
  var grad=document.querySelector('#f-grad .form-radio.sel');
  var intern=document.getElementById('f-intern').value;
  var industries=document.querySelectorAll('#f-industry .form-chip.sel');
  var ok=school&&major&&grade&&grad&&intern&&industries.length>0;
  document.getElementById('form-submit').disabled=!ok;
}

/* 监听输入变化 */
document.getElementById('f-school').addEventListener('input',checkFormValid);
document.getElementById('f-major').addEventListener('input',checkFormValid);
document.getElementById('f-grade').addEventListener('change',checkFormValid);
document.getElementById('f-intern').addEventListener('change',checkFormValid);

function submitForm(){
  /* 收集表单数据 */
  userProfile={
    school:document.getElementById('f-school').value.trim(),
    major:document.getElementById('f-major').value.trim(),
    grade:document.getElementById('f-grade').value,
    gradSchool:document.querySelector('#f-grad .form-radio.sel').textContent,
    internship:document.getElementById('f-intern').value,
    industries:Array.from(document.querySelectorAll('#f-industry .form-chip.sel')).map(function(c){return c.textContent;})
  };

  /* 关闭表单，显示加载 */
  var o=document.getElementById('form-overlay');o.classList.remove('show');
  setTimeout(function(){o.style.display='none';},300);

  showScreen('screen-loading');

  /* 模拟AI分析延迟 */
  setTimeout(function(){
    aiReport=generateMockReport(riasecCode,userProfile);
    renderReport();
    showScreen('screen-report');
  },2800);
}

    ],
    C:[
      {name:'财务分析师',match:92,reasons:['你的 C 型核心特质——重视规则、追求精确、条理分明——是财务分析的生命线','财务工作需要在规范框架内严谨操作，与你的"按流程做事"偏好完全一致','你对细节的把控力让复杂的财务数据在你手中变得清晰有序'],skills:['财务建模','Excel/SQL','合规审查','预算管理'],growth:'财务分析师 → 高级分析师 → 财务经理 → CFO'},
      {name:'合规管理专员',match:87,reasons:['合规岗位是 C 型人格的典型归属——在制度框架内确保组织安全运转','你的"符合流程+细节完整"价值取向让你天然适合合规审查工作','在合规领域，可靠和严谨不是加分项而是必修课，这正是你的底色'],skills:['法规解读','风险评估','合规审查','制度设计'],growth:'合规专员 → 合规经理 → 合规总监 → 首席合规官'},
      {name:'项目管理专员（PMO）',match:81,reasons:['PMO 岗位需要 C 型的"流程+秩序"来确保项目按计划推进','你的条理性和靠谱度让团队在复杂项目中有了"定海神针"','PMO 同时需要沟通协调，帮你拓展 S 型和 E 型能力'],skills:['项目排期','进度追踪','风险预警','流程优化'],growth:'PMO 专员 → PMO 经理 → PMO 总监 → COO'}
    ]
  };

  var primaryDim=topDims[0];
  var careers=CAREER_DB[primaryDim]||CAREER_DB['R'];

  return{
    code:code,
    profile:profile,
    summary:summary,
    careers:careers
  };
}

/* ===== 渲染报告 ===== */
function renderReport(){
  var r=aiReport;
  var h='';

  /* 头部 */
  h+='<div class="report-header"><div class="report-code">🤖 AI 深度分析报告</div><div class="report-sub">基于 '+r.code+' 型 · '+r.profile.school+' · '+r.profile.major+'</div></div>';

  /* 摘要 */
  h+='<div class="report-summary"><div class="report-summary-title">📋 综合分析</div><div class="report-summary-text">'+r.summary+'</div></div>';

  /* 职位推荐 */
  var medals=['🥇','🥈','🥉'];
  var rankCls=['r1','r2','r3'];
  h+='<div class="career-section"><div class="career-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>职业岗位推荐</div>';

  r.careers.forEach(function(c,idx){
    h+='<div class="career-rpt-card">';
    h+='<div class="career-rpt-top"><div class="career-rpt-rank '+rankCls[idx]+'">'+medals[idx]+'</div><div class="career-rpt-name">'+c.name+'</div><div class="career-rpt-match">'+c.match+'<span>%</span></div></div>';
    h+='<div class="career-rpt-bar"><div class="career-rpt-bar-fill '+rankCls[idx]+'" data-p="'+c.match+'" style="width:0%"></div></div>';

    /* 匹配原因 */
    h+='<div class="career-rpt-reasons"><div class="career-rpt-reasons-title">📝 匹配原因</div>';
    c.reasons.forEach(function(reason){
      h+='<div class="career-rpt-reason">'+reason+'</div>';
    });
    h+='</div>';

    /* 核心技能 */
    h+='<div class="career-rpt-skills">';
    c.skills.forEach(function(sk){h+='<span class="career-rpt-skill">'+sk+'</span>';});
    h+='</div>';

    /* 成长路径 */
    h+='<div class="career-rpt-growth"><div class="career-rpt-growth-label">📈 成长路径</div>'+c.growth+'</div>';

    /* 勾选 */
    h+='<div class="career-rpt-check" onclick="toggleGoalCheck(this,'+idx+')"><div class="career-rpt-check-box" id="goal-chk-'+idx+'"></div><div class="career-rpt-check-label" id="goal-lbl-'+idx+'">选择此岗位作为目标</div></div>';

    h+='</div>';
  });
  h+='</div>';

  document.getElementById('report-body').innerHTML=h;
  selectedGoals=[];

  /* 进度条动画 */
  setTimeout(function(){
    document.querySelectorAll('.career-rpt-bar-fill[data-p]').forEach(function(el){el.style.width=el.dataset.p+'%';});
  },200);
}

/* ===== 勾选目标 ===== */
function toggleGoalCheck(el,idx){
  var box=document.getElementById('goal-chk-'+idx);
  var label=document.getElementById('goal-lbl-'+idx);
  var isChecked=box.classList.contains('checked');

  if(isChecked){
    box.classList.remove('checked');box.innerHTML='';
    label.classList.remove('checked');label.textContent='选择此岗位作为目标';
    selectedGoals=selectedGoals.filter(function(i){return i!==idx;});
  }else{
    box.classList.add('checked');
    box.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    label.classList.add('checked');label.textContent='已选择';
    selectedGoals.push(idx);
  }

  document.getElementById('btn-set-goal').disabled=selectedGoals.length===0;
}

/* ===== 设置目标确认 ===== */
function confirmSetGoal(){
  if(selectedGoals.length===0)return;
  var names=selectedGoals.map(function(idx){return aiReport.careers[idx].name;});
  showModal('设为职业目标','确定将「'+names.join('」「')+'」设为你的职业目标？',function(){
    /* 保存到全局 store */
    if(typeof Store!=='undefined'){
      Store.batch({
        careerGoal: names.map(function(n){return{name:n};}),
        assessment: Object.assign({}, Store.get('assessment')||{}, {aiReport:aiReport})
      });
    }
    showToast('已设置 '+names.length+' 个职业目标');
    /* 跳转首页 */
    setTimeout(function(){
      if(typeof Router!=='undefined'){Router.toIndex();}
      else{window.location.href='index.html';}
    },1200);
  });
}

/* ===== 返回 ===== */
function goBackToResult(){
  /* 返回测评结果页 */
  if(typeof Router!=='undefined'){Router.go('assessment.html?view=result');}
  else{window.location.href='assessment.html?view=result';}
}

/* ===== 跳转职业图景 ===== */
function goToCareerVisionFromAI(){
  /* 保存 AI 报告到 store */
  if(typeof Store!=='undefined'&&aiReport){
    var assessment=Store.get('assessment')||{};
    assessment.aiReport=aiReport;
    Store.set('assessment',assessment);
  }
  if(typeof Router!=='undefined'){Router.toCareerVision();}
  else{window.location.href='career-vision.html';}
}

function goBack(){
  var active=document.querySelector('.screen.active');
  if(active.id==='screen-report'){
    showModal('确认返回','返回后当前分析结果不会保存，确认返回？',function(){
      showScreen('screen-entry');
    });
  }else if(active.id==='screen-entry'){
    /* 填写个人信息前：返回职业测评结果页 */
    if(typeof Router!=='undefined'){Router.go('assessment.html?view=result');}
    else{window.location.href='assessment.html?view=result';}
  }else{
    showScreen('screen-entry');
  }
}
</script>
